# Upstream kernel config seed pin — STABLE line (7.1).
#
# We seed our build's .config from anthraxx's (Levente Polyak's) own Arch
# Linux packaging repo for linux-hardened, signed-commit-verified against his
# key (E240B57E…) + sha256.
#
# The pin below is a SAME-LINE 7.1 config (anthraxx's 7.1.4.hardened1-1). It
# still routinely lags the kernel we build by a patch level — anthraxx changes
# config.x86_64 in only ~1 in 4–5 tags, so his newest published config is
# usually a few releases behind the tag being built. That is expected and
# handled, not gated: the seed is only a baseline. `make olddefconfig`
# reconciles it to the tree being built, the fidelity assertion enforces every
# configs/intent.config pin, and tools/check-hardening-drift.sh diffs the
# result against the most recent published 7.1 final.config in releases/ — so
# a symbol we INHERIT from the seed (rather than pin in intent) cannot
# silently regress across a seed bump.
#
# History, retained because it applies to any newly stood-up line: before
# 7.1.4.hardened1-1, anthraxx had published no 7.1 config.x86_64 at all, and
# this line was seeded CROSS-SERIES from the 7.0.12 config. That fallback is
# the intended stopgap when a line is stood up ahead of upstream packaging,
# but it is strictly worse than a same-line seed — a cross-series config sets
# different UN-pinned hardening defaults, and the drift guard cannot catch the
# difference until that line has published a release to baseline against. Bump
# to a same-line config as soon as one ships (tools/bump-seed.sh --pin-file
# configs/seeds/<X.Y>.toml <ref>, or the weekly seed-bump PR).
#
# Pinning model + bump procedure: docs/operators/config-architecture.md.

