# assertion enforces every configs/intent.config pin, and the hardening-drift
# guard covers inherited symbols once a 7.1 baseline exists. Bump this pin to a
# real 7.1 config (via tools/bump-seed.sh --pin-file configs/seeds/7.1.toml
# <ref>, or the weekly seed-bump PR) as soon as anthraxx ships one.
#
# Pinning model + bump procedure: docs/operators/config-architecture.md.

