# Upstream kernel config seed pin — STABLE line (7.1).
#
# We seed our build's .config from anthraxx's (Levente Polyak's) own Arch
# Linux packaging repo for linux-hardened, signed-commit-verified against his
# key (E240B57E…) + sha256.
#
# NOTE — the seed intentionally LAGS the kernel line: anthraxx's Arch packaging
# has not published a 7.1 config.x86_64 yet, so the 7.1 line is seeded from the
