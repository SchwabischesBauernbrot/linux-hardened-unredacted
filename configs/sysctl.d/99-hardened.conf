# sysctl defaults for the unredacted linux-hardened kernel.
#
# Shipped by the unredacted-hardened-defaults package (pulled in by the
# linux-image-hardened-unredacted-amd64 meta-package) under the vendor
# path /usr/lib/sysctl.d/99-hardened.conf. It loads at boot, and the
# package's postinst applies it on install so no reboot is needed.
#
# Every value here is documented in configs/POLICY.md with rationale
# and user-visible impact. To override on a specific machine, drop a
# higher-numbered file in the admin path (e.g.
# /etc/sysctl.d/999-local.conf) with the new value and
# `sudo sysctl --system`; /etc/sysctl.d wins over /usr/lib/sysctl.d.
# See incompatibilities.md.

# User namespaces -- frequent local-privilege-escalation vector. Disabling
# breaks rootless Docker / Podman, Chromium sandbox, Snap, Flatpak.
kernel.unprivileged_userns_clone = 0

# Restrict perf to root. Userspace perf can leak kernel pointers.
kernel.perf_event_paranoid = 3

# Restrict eBPF program loading to root.
kernel.unprivileged_bpf_disabled = 1

# Restrict ptrace to direct parent / root. `=2` blocks attach to
# non-child processes by the same user; `=3` would block ptrace entirely
# until next reboot, which is too disruptive for development workflows.
kernel.yama.ptrace_scope = 2

# Hide kernel pointers (%pK) from everyone, including root -- defeats
# address-harvesting used to break KASLR or target exploits.
kernel.kptr_restrict = 2

# Constant-blind the BPF JIT for all users (anti JIT-spray). The JIT is
# always on; unprivileged BPF is already disabled, so this hardens the
# privileged-BPF path that remains.
net.core.bpf_jit_harden = 2

# Block on-demand autoload of TTY line disciplines (historic LPE surface
# via TIOCSETD). A sysctl, not CONFIG_LDISC_AUTOLOAD=n, so the rare
# serial/PPP user can re-enable it with a higher-numbered /etc/sysctl.d file.
dev.tty.ldisc_autoload = 0
