# Tracked kernel lines.
#
# Single source of truth for which hardened-kernel lines we build and publish,
# and their per-line metadata. Consumed by:
#   - build/build-debs.sh        meta-package naming (per-line + umbrella)
#   - tools/prune.py             retention buckets + per-line keep_in_main
#   - .forgejo/workflows/seed-bump.yml   the stable line's seed bumps
# via the helper tools/lines.py (Python consumers import it; shell consumers
# call `python3 tools/lines.py <query>`).
#
# The `series` (kernel major.minor) is the LINE KEY used everywhere: seed
# selection (configs/seeds/<series>.toml), meta-package naming, prune
# bucketing, and drift-baseline scoping.
#
# We currently track a single rolling STABLE line. The machinery is multi-line
# capable: to track an additional line, add a [[line]] block and a matching
# configs/seeds/<series>.toml. A second stable-cadence line anthraxx packages
# would use an arch-git seed like the one below; an LTS line that anthraxx's
# Arch packaging no longer carries (e.g. a 6.x LTS) would need a seed sourced
# from the distro that maintains that LTS — see docs/operators/config-architecture.md.
#
# `kind` is one of:
#   stable    exactly one; gets the unversioned umbrella metas and the daily
#             seed bumps, and is the line new tags are normally cut from.
#   previous  a line we no longer advance but still retain packages for
#             (its keep_in_main keeps prune honest); no umbrella metas.
#
# Advancing the stable line (e.g. 7.1 -> 7.2) is ONE command:
#     tools/advance-line.sh 7.2 <anthraxx 7.2 packaging ref>
# It creates configs/seeds/7.2.toml (header from tools/seed-header.tmpl,
# signature-verified pin), repoints the configs/upstream-seed.toml symlink,
# demotes the current stable block here to kind = "previous", and appends the
# new stable block. seed-bump.yml runs the same helper automatically when
# anthraxx's packaging moves to a new series, and proposes it as a PR. The
# umbrella meta, prune buckets, and drift scope all follow. Merge the advance
# together with the first tag of the new series: after it lands, an old-line
# tag still builds but no longer emits the umbrella metas.
#
# Before anthraxx has packaged the new series, `tools/advance-line.sh 7.3
# --bridge` makes the same edits but keeps the current stable pin in the new
# seed file, marked `# cross-series-seed:` (a BRIDGED line; see
# docs/operators/config-architecture.md#bridging-a-new-series). seed-bump.yml
# ends the bridge when his config for the series ships.
#
# Old minors are retained per line until you retire a line by setting its
# keep_in_main = 0 (explicit sunset); delete the block once nothing remains.
#
# Line sets per flavor: a block may carry `flavor = "<name>"`, naming the line
# set it belongs to; a block without one belongs to "amd64". A flavor
# descriptor's `lines` key (configs/flavors/<flavor>.toml) names the set it
# builds, and `kind = "stable"` is exactly-one PER SET, so one flavor's
# umbrella metas never follow another's stable series. A line's key is
# (set, series): two sets may track the same series, and seed lookup,
# retention (tools/prune.py) and the drift baseline are all per set.
#
# Pin paths follow a convention the build computes without reading this file
# (tools/lines.py pin_path): amd64 seeds are configs/seeds/<X.Y>.toml; every
# other set's are configs/seeds/<set>/<X.Y>.toml. A set whose flavor builds
# from a pinned git tree (source = "rpi-git") also declares
# `source = "configs/sources/<set>/<X.Y>.toml"`. The pi5 line is stood up by
# hand (tools/advance-line.sh only knows anthraxx's packaging); see
# docs/operators/config-architecture.md#flavors.

[[line]]
series       = "7.1"
kind         = "previous"
keep_in_main = 3
seed         = "configs/seeds/7.1.toml"

[[line]]
series       = "7.2"
kind         = "previous"
keep_in_main = 3
seed         = "configs/seeds/7.2.toml"

# Raspberry Pi 5 (configs/flavors/pi5.toml): Raspberry Pi's rpi-6.18.y tree at
# a pinned commit, seeded from Raspberry Pi OS's packaged rpi-2712 config.
# Tracks anthraxx's 6.18 branch, so most builds are forward-ports.
[[line]]
flavor       = "pi5"
series       = "6.18"
kind         = "stable"
keep_in_main = 3
seed         = "configs/seeds/pi5/6.18.toml"
source       = "configs/sources/pi5/6.18.toml"

[[line]]
series       = "7.3"
kind         = "stable"
keep_in_main = 3
seed         = "configs/seeds/7.3.toml"
