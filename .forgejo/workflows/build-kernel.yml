name: build-kernel
on:
  push:
    # One glob per flavor: its tag_prefix in front of the release grammar
    # (tools/flavors.py tag-globs; validate.yml checks this list matches).
    tags: ['v*.*.*-hardened*', 'pi5-v*.*.*-hardened*']
  # TEST BUILD: build what a tag would build, from the dispatched ref, with a
  # throwaway signing key generated in the job. The production signing secrets
  # are never passed to a test build, the stale-tag guard does not apply (no
  # tag exists), and nothing is attached to a release. Everything else --
  # source and seed verification, fidelity, drift guard, QEMU smoke test,
  # manifest -- runs exactly as for a tag. Used to prove a pipeline change
  # (e.g. a new flavor) end to end without cutting a release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test-build (not created), e.g. pi5-v6.18.60-fwd-v6.18.56-hardened1'
        required: true
        type: string

# Per spec §6.1: the build stages do NOT hold publish credentials.
# REGISTRY_TOKEN, FASTLY_PURGE_TOKEN, and MANIFEST_COMMIT_TOKEN are
# referenced only by publish.yml. This workflow holds the kernel
# signing secrets and the release-asset token. Compromise of the
# Forgejo host implies signing-key compromise; the trade-off is
# accepted for build automation.

jobs:
  build:
    runs-on: linux-hardened
    container:
      # The whole build runs in this one container. We previously also
      # had a per-target Dockerfile that an outer docker-in-docker daemon
      # built and then ran the kernel build inside; the sibling-container
      # bind mounts kept landing on paths the dind daemon couldn't see
      # (the job container's filesystem is invisible to dind). Collapsing
      # to a single container makes the path arithmetic trivial.
      #
      # Network isolation IS enforced at compile time: the "configure +
      # build" step below wraps configure-kernel.sh + build-debs.sh in
      # `unshare -n`, so the kernel build runs with no network (inputs were
      # already fetched + verified in earlier network-ON steps). If the
      # runner cannot create a network namespace, the build falls back to
      # running without isolation and logs a WARNING — unless the repo
      # variable REQUIRE_NET_ISOLATION=1 is set, which turns the missing
      # namespace into a hard failure. Granting the runner container
      # CAP_SYS_ADMIN (what `unshare -n` requires) and setting that variable
      # is the operator step in docs/operators/runner-setup.md.
      image: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    # No flavor matrix: a tag belongs to exactly one flavor, the one whose
    # tag_prefix it carries (amd64's is empty), so the "resolve flavor" step
    # routes each tag to its flavor. configs/flavors/<flavor>.toml holds
    # everything flavor-dependent, read by that step and by every build/*.sh
    # script. Every flavor builds on this amd64 runner; one for another
    # architecture is cross-compiled (build/install-flavor-deps.sh).
    steps:
      # This step must run BEFORE actions/checkout, because actions/
      # checkout is a JavaScript action and Forgejo's act runner invokes
      # it by `docker exec node /action/dist/index.js`. debian:trixie
      # ships neither nodejs nor git, so without this the very first
      # action fails with `exec: "node": not found`.
      #
      # Since the build now runs directly in this job container (no
      # inner docker), we also install the full kernel-build toolchain
      # here. The list has two parts:
      #
      #   1. An explicit set the workflow scripts call directly:
      #        nodejs                every JavaScript action (checkout, etc.)
      #        git, ca-certificates  actions/checkout
      #        wget, gpg             build/fetch-sources.sh
      #        xz-utils, patch       build/apply-patches.sh
      #        openssl, libssl3      key-materialization step
      #        sbsigntool            build/sign-debs.sh (sbsign, sbverify)
      #        zstd, lz4, bzip2, gzip   build/sign-debs.sh + kernel image
      #                                 compression
      #        jq, curl              release-asset upload
      #        dpkg-dev, devscripts  dch + dpkg-architecture (consumed by
      #                              build-debs.sh and by apt-get build-dep
      #                              below)
      #
      #   2. Everything the Debian linux source package declares as a
      #      build dependency, fetched via `apt-get build-dep linux`.
      #      That's the canonical source of truth: the Debian maintainers
      #      already enumerated what their packaging needs (build-essential,
      #      kernel-wedge, python3-dacite, kernel-package, etc.). Pulling
      #      it from the source package means we don't drift from upstream
      #      Debian's build inputs and don't play whack-a-mole every time
      #      they add a Python module to debian/bin/.
      #
      # Cost: ~5 minutes against a 20-60 minute kernel build. A follow-up
      # bakes these into a pre-built runner image pushed to the Forgejo
      # container registry and drops this step to ~10 seconds.
      - name: install build deps in job container
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
              nodejs \
              git ca-certificates wget gpg xz-utils patch \
              openssl libssl3 sbsigntool zstd lz4 bzip2 gzip jq curl \
              dpkg-dev devscripts
          # Enable deb-src so `apt-get source linux` and `apt-get build-dep
          # linux` work. Handles both the deb822-format
          # sources.list.d/debian.sources (trixie default) and the legacy
          # /etc/apt/sources.list.
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
              sed -i 's/^Types: deb$/Types: deb deb-src/' \
                  /etc/apt/sources.list.d/debian.sources
          else
              sed -i 's|^deb \(.*\)$|deb \1\ndeb-src \1|' /etc/apt/sources.list
          fi
          apt-get update
          # Pull in the Debian linux source's declared build dependencies.
          # This is the canonical set; it covers build-essential, bc, bison,
          # flex, libssl-dev, libelf-dev, dwarves, rsync, kmod, cpio, python3,
          # python3-dacite, debhelper, kernel-wedge, libdw-dev, libpci-dev,
          # pkg-config, fakeroot, quilt, gawk, libncurses-dev, and anything
          # else upstream adds in future point releases.
          apt-get build-dep -y --no-install-recommends linux
          # GCC plugin headers so kconfig can enable CONFIG_GCC_PLUGINS
          # (stackleak / latent_entropy hardening). build-dep above pulled
          # in gcc itself; match its major version. Without this package the
          # whole plugin subtree is hidden and silently dropped from .config.
          apt-get install -y --no-install-recommends \
              "gcc-$(gcc -dumpversion | cut -d. -f1)-plugin-dev"

      - uses: actions/checkout@v4
        with:
          # Full history + tags so the derive-version step can read the
          # tagger date and validate against the actual tag object.
          fetch-depth: 0
          fetch-tags: true

      # Route the tag to its flavor and load the descriptor. The tag is the
      # pushed tag, or a test build's `tag` input. tools/flavors.py validates
      # every descriptor (schema, intent fragments, cross-flavor uniqueness)
      # and refuses one that asks for something this pipeline does not build
      # yet -- a QEMU smoke test or boot package nothing would run is a guard
      # that silently does not exist. It then names the one flavor whose
      # tag_prefix + release grammar the tag matches, or fails. The scalar
      # fields become step outputs (name, arch, qemu_smoke, ...), plus `tag`
      # and `test_build`, for the steps below.
      - name: resolve flavor
        id: flavor
        env:
          # Via env:, never spliced into the script (see the stale-tag step).
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ $EVENT == workflow_dispatch ]]; then
            tag=$INPUT_TAG
            test_build=true
            echo "::notice::TEST BUILD of $tag from $REF_NAME: throwaway signing key, nothing uploaded"
          else
            tag="${GITHUB_REF_NAME:-$REF_NAME}"
            test_build=false
          fi
          python3 tools/flavors.py validate
          # A failing command substitution in an assignment fails the step.
          flavor=$(python3 tools/flavors.py for-tag "$tag")
          echo "tag $tag -> flavor $flavor"
          {
            echo "tag=$tag"
            echo "test_build=$test_build"
            python3 tools/flavors.py gha-outputs "$flavor"
          } | tee -a "$GITHUB_OUTPUT"

      # The flavor's extras on top of the common toolchain: the cross
      # toolchain for a flavor of another architecture (pi5's arm64 on this
      # amd64 runner) and the QEMU smoke test's emulator and busybox. A no-op
      # for amd64, whose build environment stays the common one.
      - name: install flavor deps
        env:
          FLAVOR: ${{ steps.flavor.outputs.name }}
        run: ./build/install-flavor-deps.sh

      # TEST BUILD only: a throwaway module-signing key + certificate, made
      # here so the build and sign steps below never see the production key.
      # A kernel built with it trusts only this key, which is gone at job end.
      - name: throwaway signing key (test build)
        if: steps.flavor.outputs.test_build == 'true'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/testkey"
          openssl req -x509 -newkey rsa:4096 -nodes -sha256 -days 30 -batch \
              -subj "/CN=linux-hardened-unredacted TEST BUILD throwaway key/" \
              -keyout "$RUNNER_TEMP/testkey/signing.key" \
              -out "$RUNNER_TEMP/testkey/signing.crt" 2>/dev/null
          openssl x509 -in "$RUNNER_TEMP/testkey/signing.crt" -noout -subject -fingerprint -sha256

      # A tag cut from a stale checkout is a perfectly valid tag on an old
      # commit, and the build goes GREEN while silently losing two properties:
      #
      #   1. It uses whatever configs/seeds/<X.Y>.toml pin existed at that
      #      commit, not the current one. Seed bumps land on main as merged
      #      PRs (seed-bump.yml) between builds, so a stale tag can build the
      #      previous baseline — or, worse, a cross-series fallback seed after
      #      main has already advanced to a real same-line seed. The seed sets
      #      every UN-pinned hardening default, so this is a real config delta,
      #      not a cosmetic one; the fidelity assertion won't catch it because
      #      the intent fragments are still satisfied.
      #   2. It skips the hardening-drift guard entirely. That step picks its
      #      baseline from releases/ *in the tag's own tree*, and each release
      #      dir is added by the `publish:` commit that follows its build. A
      #      tag predating the first publish of its line finds no baseline and
      #      logs "skipping" — so the one check that would have caught (1)
      #      is itself disabled by the same mistake.
      #
      # Both failures are invisible in a green log, so this is a hard failure
      # rather than a warning: a WARNING here scrolls past in a 40-minute
      # build. Set the repo variable ALLOW_STALE_TAG=1 to downgrade it to a
      # warning for a deliberate rebuild of an old commit (same escape-hatch
      # pattern as REQUIRE_NET_ISOLATION below, inverted).
      #
      # A test build has no tag: it builds the dispatched ref on purpose, and
      # produces nothing that ships.
      - name: assert tag is current with main
        if: steps.flavor.outputs.test_build != 'true'
        env:
          ALLOW_STALE_TAG: ${{ vars.ALLOW_STALE_TAG }}
          # Via env:, not spliced into the script body. The runner substitutes
          # an expression template into the `run:` text BEFORE bash parses it,
          # so a ref name containing a double quote would close the assignment
          # at parse time and run the remainder as shell — in the job that
          # holds KERNEL_SIGNING_KEY. GITHUB_REF_NAME is normally already set
          # by the runner; REF_NAME is the documented fallback for act runners
          # that don't export it.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-$REF_NAME}"
          # The checkout above fetched tags but not necessarily the main
          # branch ref. Fetch it with an EXPLICIT destination refspec rather
          # than `git fetch origin main`: when checkout runs against a tag it
          # may configure a tag-only fetch refspec on the remote, in which
          # case the bare form updates only FETCH_HEAD and leaves
          # refs/remotes/origin/main absent (making every comparison below
          # fail on an unknown revision).
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # --is-ancestor origin/main <tag> is true when the tag contains
          # every commit on main, i.e. the tag is AT or AHEAD of main. The
          # stale case is exactly when that's false.
          if git merge-base --is-ancestor origin/main "$tag^{commit}"; then
            echo "tag $tag is current with origin/main"
            exit 0
          fi
          echo "commits on origin/main missing from $tag:" >&2
          git log --oneline "$tag..origin/main" >&2
          if [[ "${ALLOW_STALE_TAG:-}" == "1" ]]; then
            echo "::warning::tag $tag is behind origin/main; building anyway (ALLOW_STALE_TAG=1)"
            exit 0
          fi
          echo "::error::tag $tag was cut from a stale checkout and is behind origin/main." >&2
          echo "::error::This build would use the seed pin from the tagged commit and may skip" >&2
          echo "::error::the hardening-drift check. Delete the tag, pull, and re-cut it:" >&2
          echo "::error::  git push origin :refs/tags/$tag && git tag -d $tag" >&2
          echo "::error::  git switch main && git pull --ff-only" >&2
          echo "::error::  git tag $tag && git push origin $tag" >&2
          echo "::error::To build this commit deliberately, set the repo variable ALLOW_STALE_TAG=1." >&2
          exit 1

      - name: derive version
        id: ver
        env:
          # Via env: rather than spliced into the script body — see the
          # explanation on the "assert tag is current with main" step above.
          # This matters even though the regex below rejects a malformed tag:
          # the injection happens at bash PARSE time, before the regex ever
          # runs, so the validation cannot protect the assignment that feeds it.
          # The tag (pushed, or a test build's input) as "resolve flavor"
          # routed it.
          FULL_TAG: ${{ steps.flavor.outputs.tag }}
          TEST_BUILD: ${{ steps.flavor.outputs.test_build }}
          # The flavor's tag prefix ("" for amd64; "<flavor>-" for the others).
          TAG_PREFIX: ${{ steps.flavor.outputs.tag_prefix }}
        run: |
          set -euo pipefail
          # A tag belongs to exactly one flavor, by prefix. For amd64 the
          # prefix is empty and the grammar below starts with "v", so a
          # prefixed tag (pi5-v...) can never pass as an amd64 build.
          # "resolve flavor" already routed it; this is the backstop.
          if [[ $FULL_TAG != "$TAG_PREFIX"* ]]; then
            echo "tag $FULL_TAG does not carry this flavor's tag prefix '$TAG_PREFIX'" >&2
            exit 1
          fi
          tag=${FULL_TAG#"$TAG_PREFIX"}
          # Fail loud on malformed tags. A typo'd tag would otherwise
          # silently feed garbage to wget in the next step.
          #
          # The optional trailing .N is a packaging revision: it lets us
          # re-ship the SAME upstream kernel + hardened revision with
          # packaging-only changes (e.g. a fixed meta dependency or an
          # added sidecar package). v7.0.10-hardened1.1 fetches the same
          # 7.0.10 + hardened1 sources but stamps the .deb version
          # 7.0.10-hardened1.1, which apt sees as an upgrade over
          # 7.0.10-hardened1. (Bash ERE has no non-capturing groups, so
          # group 4 holds the packaging number.)
          #
          # hardenedN and the optional .P are [1-9][0-9]* — no leading
          # zeros, and .P must be >=1: a ".0" packaging tag would stamp a
          # .deb version that dpkg sorts ABOVE the bare -hardenedN (a
          # non-empty revision beats an absent one), which is never
          # intended. X.Y.Z stays [0-9]+ (the "0" in 7.0.10 is legitimate).
          #
          # The optional -fwd-vB infix is a FORWARD-PORT: v7.2.13-fwd-v7.2.10-
          # hardened1 builds the kernel.org 7.2.13 tarball with anthraxx's
          # signed v7.2.10-hardened1 patch, for when kernel.org has shipped
          # stable releases anthraxx has not tagged yet (docs/users/cve-
          # policy.md). The suffix after -fwd- is literally the upstream tag
          # whose patch is used, so the tag says exactly what went in. Groups:
          # 1 kernel, 3 base kernel, 4 hardened revision, 6 packaging.
          if [[ ! $tag =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-fwd-v([0-9]+\.[0-9]+\.[0-9]+))?-hardened([1-9][0-9]*)(\.([1-9][0-9]*))?$ ]]; then
            echo "tag does not match vX.Y.Z[-fwd-vX.Y.B]-hardenedN[.P] (N,P >=1, no leading zeros): $tag" >&2
            exit 1
          fi
          kernel="${BASH_REMATCH[1]}"
          base="${BASH_REMATCH[3]:-}"
          hardened="${BASH_REMATCH[4]}"
          packaging="${BASH_REMATCH[6]:-}"
          if [[ -n $base ]]; then
            # fetch-sources.sh enforces the same rule; failing here as well
            # keeps a bad tag from getting as far as a download.
            if [[ ${base%.*} != "${kernel%.*}" ]] \
                || [[ $(printf '%s\n%s\n' "$base" "$kernel" | sort -V | head -n1) != "$base" ]] \
                || [[ $base == "$kernel" ]]; then
              echo "forward-port base v$base must be an OLDER release of the ${kernel%.*} series than $kernel: $tag" >&2
              exit 1
            fi
          fi
          # Tagger date is stable across rebase/amend; commit timestamp
          # is not. Lightweight tags have no tagger date, in which case
          # taggerdate:unix yields empty and we fall back, with a log
          # line so it's visible in CI output. The lookups use the full tag,
          # prefix included: that is the ref that exists. A test build has
          # no tag, so it takes the dispatched commit's timestamp.
          if [[ $TEST_BUILD == true ]]; then
            sde=$(git log -1 --format=%ct HEAD)
          else
            sde=$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$FULL_TAG")
            if [[ -z $sde ]]; then
              echo "lightweight tag, falling back to commit timestamp for SOURCE_DATE_EPOCH" >&2
              sde=$(git log -1 --format=%ct "$FULL_TAG^{commit}")
            fi
          fi
          # series is the kernel line key (X.Y): it selects the per-line seed
          # pin (configs/seeds/<X.Y>.toml) and scopes the hardening-drift
          # baseline to the same line.
          series="${kernel%.*}"
          echo "kernel=$kernel"             >> "$GITHUB_OUTPUT"
          echo "hardened=$hardened"         >> "$GITHUB_OUTPUT"
          echo "base=$base"                 >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging"       >> "$GITHUB_OUTPUT"
          echo "series=$series"             >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$sde"     >> "$GITHUB_OUTPUT"

      # A forward-port exists to bridge the gap until anthraxx tags the same
      # kernel. Once he has, building the stand-in would ship a weaker
      # artifact than the one available (his tag may carry real changes for
      # that release), so refuse and point at the genuine tag. An unreachable
      # GitHub API is a warning, not a failure: availability during upstream
      # trouble is the whole point of this mode, and every input is still
      # signature-verified in the next step either way.
      - name: forward-port only while upstream has not tagged this kernel
        if: steps.ver.outputs.base != ''
        env:
          KERNEL: ${{ steps.ver.outputs.kernel }}
        run: |
          set -euo pipefail
          if ! tags=$(curl -fsSL "https://api.github.com/repos/anthraxx/linux-hardened/tags?per_page=100"); then
            echo "::warning::could not list anthraxx tags; cannot confirm v$KERNEL-hardened* is still untagged"
            exit 0
          fi
          esc=${KERNEL//./\\.}
          genuine=$(jq -r '.[].name' <<<"$tags" | grep -E "^v${esc}-hardened[0-9]+$" | sort -V | tail -n1 || true)
          if [[ -n $genuine ]]; then
            echo "::error::anthraxx has tagged $genuine; build that instead of a forward-port:" >&2
            echo "::error::  git tag $genuine && git push origin $genuine" >&2
            exit 1
          fi
          echo "no upstream v$KERNEL-hardened* tag yet; forward-port is warranted"

      - name: fetch sources
        env:
          KERNEL_VERSION: ${{ steps.ver.outputs.kernel }}
          HARDENED_REVISION: ${{ steps.ver.outputs.hardened }}
          HARDENED_BASE_VERSION: ${{ steps.ver.outputs.base }}
          FLAVOR: ${{ steps.flavor.outputs.name }}
          WORKDIR: ${{ runner.temp }}/work
        run: |
          mkdir -p "$WORKDIR"
          ./build/fetch-sources.sh

      - name: fetch + verify upstream config seed
        # Selects the per-line seed pin (configs/seeds/<series>.toml via
        # SERIES) — anthraxx's signed config.x86_64 for the stable line —
        # runs `git verify-commit` against the pinned key fpr, and
        # sha256-verifies the bytes. The flavor's seed_type picks the fetcher.
        # Network-ON; results land in $WORKDIR for the network-isolated
        # configure step below.
        env:
          WORKDIR: ${{ runner.temp }}/work
          SERIES: ${{ steps.ver.outputs.series }}
          FLAVOR: ${{ steps.flavor.outputs.name }}
          # Escape hatch for a deliberate one-off build of a series that has no
          # configs/seeds/<X.Y>.toml yet. Unset (the default) makes that a hard
          # failure: silently falling back to the stable-line seed builds one
          # series' kernel from another series' config while the fidelity
          # assertion still passes and the drift guard finds no baseline and
          # skips. See build/fetch-seed.sh's resolution block.
          ALLOW_CROSS_SERIES_SEED: ${{ vars.ALLOW_CROSS_SERIES_SEED }}
        run: ./build/fetch-seed.sh

      - name: apply patches
        env:
          WORKDIR: ${{ runner.temp }}/work
          KERNEL_VERSION: ${{ steps.ver.outputs.kernel }}
          HARDENED_REVISION: ${{ steps.ver.outputs.hardened }}
          HARDENED_BASE_VERSION: ${{ steps.ver.outputs.base }}
          # Which tree to extract: the kernel.org tarball, or the pinned
          # downstream tree fetch-sources.sh archived (source = rpi-git).
          FLAVOR: ${{ steps.flavor.outputs.name }}
        run: ./build/apply-patches.sh

      - name: configure + build
        env:
          KERNEL_VERSION: ${{ steps.ver.outputs.kernel }}
          HARDENED_REVISION: ${{ steps.ver.outputs.hardened }}
          HARDENED_BASE_VERSION: ${{ steps.ver.outputs.base }}
          PACKAGING_REVISION: ${{ steps.ver.outputs.packaging }}
          FLAVOR: ${{ steps.flavor.outputs.name }}
          # No REVISION here any more. It used to pass github.run_number to
          # build-debs.sh, which fed it to KBUILD_BUILD_VERSION and so into
          # UTS_VERSION inside vmlinux -- making two runs of the same tag differ
          # while the .deb version stayed identical, and while nothing recorded
          # the value. KBUILD_BUILD_VERSION now derives from the tag; the run
          # number is recorded in the manifest as ci_run_number.
          SOURCE_DATE_EPOCH: ${{ steps.ver.outputs.source_date_epoch }}
          WORKDIR: ${{ runner.temp }}/work
          # The production key only for a tag push; a test build gets empty
          # values here and uses the throwaway key made above.
          TEST_BUILD: ${{ steps.flavor.outputs.test_build }}
          SIGNING_KEY: ${{ github.event_name == 'push' && secrets.KERNEL_SIGNING_KEY || '' }}
          SIGNING_CERT: ${{ github.event_name == 'push' && secrets.KERNEL_SIGNING_CERT || '' }}
          # Optional gate: set the repo variable REQUIRE_NET_ISOLATION=1 to
          # HARD-FAIL when unshare -n isn't available, instead of silently
          # compiling without network isolation (see the fallback below).
          REQUIRE_NET_ISOLATION: ${{ vars.REQUIRE_NET_ISOLATION }}
        run: |
          set -euo pipefail
          # Materialize the project signing key + cert into a tmpfs file.
          # configure-kernel.sh copies it to the FIXED in-tree path
          # configs/intent.common.config pins (certs/unredacted-signing.pem) -- the
          # .config value is a constant and is never rewritten, so no runner
          # path can leak into the shipped config. The build then signs every
          # module with our key and embeds our cert in .builtin_trusted_keys,
          # so the kernel intrinsically trusts our signatures without MOK
          # enrollment. The same key+cert is re-materialized by the sign step
          # later to sign vmlinuz for UEFI Secure Boot.
          umask 077
          keydir=$(mktemp -d)
          # Clean up BOTH copies: the tmpfs staging dir and the in-tree copy.
          # build-debs.sh shreds the in-tree key on the success path; this trap
          # covers every failure path, where the tree is left behind for
          # debugging and must not contain a private key.
          trap 'rm -rf "$keydir"; rm -f "$WORKDIR"/linux-*/certs/unredacted-signing.pem' EXIT
          if [[ $TEST_BUILD == true ]]; then
            [[ -z $SIGNING_KEY ]] || { echo "a test build must not see the production key" >&2; exit 1; }
            cp "$RUNNER_TEMP/testkey/signing.key" "$RUNNER_TEMP/testkey/signing.crt" "$keydir/"
          else
            cat <<<"$SIGNING_KEY"  > "$keydir/signing.key"
            cat <<<"$SIGNING_CERT" > "$keydir/signing.crt"
          fi
          # The kernel build wants one PEM file containing both the key
          # and the cert. Concatenate in that order.
          cat "$keydir/signing.key" "$keydir/signing.crt" \
              > "$keydir/signing.pem"
          openssl pkey -in "$keydir/signing.key" -noout
          openssl x509 -in "$keydir/signing.crt" -noout
          export MODULE_SIG_KEY_PATH="$keydir/signing.pem"
          # Nothing is exported across steps: the trap above deletes $keydir at
          # the end of THIS step, and the sign step re-materializes its own copy
          # from the same secrets. (This comment previously said the paths were
          # exported "too", which contradicted itself and invited a future
          # editor to add a cross-step export that would defeat the cleanup.)

          # Run the compile with NO network. All sources are fetched and
          # build-deps installed in earlier steps; the kernel build itself
          # must not reach out. Defense-in-depth: a malicious build/Kbuild
          # step can't exfiltrate the signing material in tmpfs nor pull
          # bytes mid-build. unshare -n needs CAP_SYS_ADMIN; if the runner
          # doesn't grant it, fall back to building without isolation (rather
          # than failing) and log loudly so the operator can enable it.
          run_build() {
              ./build/configure-kernel.sh
              ./build/build-debs.sh
          }
          export -f run_build
          if unshare -n true 2>/dev/null; then
              echo "isolating compile in a network namespace (unshare -n)"
              unshare -n bash -euo pipefail -c \
                  'ip link set lo up 2>/dev/null || true; run_build'
          else
              if [[ "${REQUIRE_NET_ISOLATION:-}" == "1" ]]; then
                  echo "ERROR: unshare -n not permitted and REQUIRE_NET_ISOLATION=1;" >&2
                  echo "ERROR: refusing to compile without network isolation while the" >&2
                  echo "ERROR: signing key is materialized in tmpfs. Grant the build" >&2
                  echo "ERROR: container CAP_SYS_ADMIN (see OPERATOR_TODO.md)." >&2
                  exit 1
              fi
              echo "WARNING: unshare -n not permitted; building WITHOUT network" >&2
              echo "WARNING: isolation. Grant CAP_SYS_ADMIN to the build container," >&2
              echo "WARNING: or set REQUIRE_NET_ISOLATION=1 to make this a hard fail" >&2
              echo "WARNING: (see OPERATOR_TODO.md)." >&2
              run_build
          fi

      - name: hardening drift guard
        # configure-kernel.sh's fidelity assertion only covers the symbols
        # pinned in the flavor's intent fragments. The hardening symbols we
        # inherit from the seed (the LSMs, BPF_UNPRIV_DEFAULT_OFF, the
        # kstack/slab family, ...) are unchecked and could silently regress
        # across a kernel bump against a lagging seed. Diff this build's
        # final.config against the most recent committed release of the same
        # flavor and line, and fail on any enabled hardening symbol that
        # dropped or any hardening value symbol (ASLR bits, LSM order, KFENCE
        # interval) that changed. Runs here, in the workflow, NOT inside
        # build-debs.sh — so repro-check.sh's rebuild (which calls
        # build-debs.sh directly) isn't coupled to a policy gate it shouldn't
        # enforce. First build of a flavor's line: no same-line baseline. If
        # the line is BRIDGED (tools/advance-line.sh <X.Y> --bridge: seeded
        # from the previous line's config), its first build compares against
        # that line's newest release instead, in check-hardening-drift.sh's
        # bridge mode; otherwise the guard skips with a warning.
        env:
          WORKDIR: ${{ runner.temp }}/work
          SERIES: ${{ steps.ver.outputs.series }}
          FLAVOR: ${{ steps.flavor.outputs.name }}
          # Bridge mode tells a symbol the new series REMOVED from one it
          # turned off by scanning this tree's Kconfig files
          # (build/configure-kernel.sh's src_dir).
          KERNEL_VERSION: ${{ steps.ver.outputs.kernel }}
          # Escape hatch for a REVIEWED, intentional hardening-symbol drop
          # (e.g. upstream removed the symbol). check-hardening-drift.sh has
          # honoured this variable since it was written, and BOTH
          # configs/POLICY.md and docs/operators/config-architecture.md tell the
          # operator to set it as a repo variable — but it was never listed
          # here, so `vars.ALLOW_HARDENING_REGRESSION` never reached the script
          # and the documented override was inert. Without it, the only way past
          # a drift failure is a commit to main, which the stale-tag guard above
          # then turns into "delete and re-cut the tag" — mid-CVE-SLA. Same
          # plumbing as ALLOW_STALE_TAG and REQUIRE_NET_ISOLATION.
          ALLOW_HARDENING_REGRESSION: ${{ vars.ALLOW_HARDENING_REGRESSION }}
        run: |
          set -euo pipefail
          new="$WORKDIR/final.config"
          [[ -f $new ]] || { echo "no $new — did the build step run?" >&2; exit 1; }
          # An empty SERIES or FLAVOR would make the lookup below match
          # nothing and the guard "skip" — i.e. silently disable itself. Both
          # are always set; assert rather than trust, because the failure is
          # invisible.
          [[ -n ${SERIES:-} && -n ${FLAVOR:-} ]] || {
            echo "::error::SERIES or FLAVOR is empty; the drift baseline cannot be scoped" >&2
            exit 1
          }
          # Scope the baseline to the SAME flavor and kernel line (X.Y).
          # Comparing a 6.12 build against a 7.x final.config, or a pi5 build
          # against an amd64 one, would flag every symbol that only exists
          # (or is only enabled) on the other as a false regression.
          # tools/flavors.py matches release dirs by the flavor's tag prefix
          # and the release-tag grammar, cross-checks each candidate's
          # manifest flavor, and picks the newest by version (sort -V order).
          # A failing lookup fails the step: `set -e` sees a failing command
          # substitution in an assignment.
          baseline=$(python3 tools/flavors.py drift-baseline "$FLAVOR" "$SERIES" releases)
          line_set=$(python3 tools/flavors.py get "$FLAVOR" lines)
          bridged_from=$(python3 tools/lines.py bridge-from "$SERIES" "$line_set")
          bridge_baseline=""
          if [[ -z $baseline && -n $bridged_from ]]; then
            bridge_baseline=$(python3 tools/flavors.py drift-baseline "$FLAVOR" "$bridged_from" releases)
          fi
          if [[ -n $baseline ]]; then
            echo "hardening-drift baseline (flavor $FLAVOR, line $SERIES): $baseline"
            ./tools/check-hardening-drift.sh "$FLAVOR" "$baseline" "$new"
          elif [[ -n $bridge_baseline ]]; then
            echo "line $SERIES is bridged on the $bridged_from seed and has no release of its own yet"
            echo "hardening-drift baseline (flavor $FLAVOR, BRIDGE from line $bridged_from): $bridge_baseline"
            DRIFT_BRIDGE_FROM=$bridged_from \
            KCONFIG_SRCTREE="$WORKDIR/linux-${KERNEL_VERSION}" \
              ./tools/check-hardening-drift.sh "$FLAVOR" "$bridge_baseline" "$new"
          else
            # ::warning:: not a bare echo: a SKIPPED guard is a materially
            # different outcome from a passed one, and a plain echo scrolls
            # past in a 40-minute build log. This is the legitimate
            # first-build-of-a-line case, but it is also what a mis-set SERIES
            # or a missing releases/ dir looks like, so it should be visible in
            # the run summary rather than buried.
            echo "::warning::hardening-drift guard SKIPPED — no prior $FLAVOR $SERIES release baseline in releases/"
          fi

      # Boot the built kernel under QEMU and check, at runtime, what the
      # fidelity assertion and drift guard check in the config: lockdown mode,
      # active LSMs, mmap ASLR bits and mmap_min_addr, and module-signature
      # enforcement (a packaged module loads; the same module stripped of its
      # signature, or altered under it, is rejected). Expectations come from
      # this build's final.config (tools/qemu-smoke.sh). Runs before signing,
      # so a kernel that fails it is never signed or attached. For flavors
      # whose descriptor sets qemu_smoke (pi5).
      - name: QEMU smoke test
        if: steps.flavor.outputs.qemu_smoke == 'true'
        env:
          WORKDIR: ${{ runner.temp }}/work
          FLAVOR: ${{ steps.flavor.outputs.name }}
        run: ./tools/qemu-smoke.sh

      - name: sign kernel + modules
        env:
          WORKDIR: ${{ runner.temp }}/work
          # sign-debs.sh signs the image or not per the descriptor's
          # image_signing.
          FLAVOR: ${{ steps.flavor.outputs.name }}
          TEST_BUILD: ${{ steps.flavor.outputs.test_build }}
          SIGNING_KEY: ${{ github.event_name == 'push' && secrets.KERNEL_SIGNING_KEY || '' }}
          SIGNING_CERT: ${{ github.event_name == 'push' && secrets.KERNEL_SIGNING_CERT || '' }}
        run: |
          set -euo pipefail
          # Materialize the key + cert into the runner's tmpfs only for
          # this step. Bash here-strings preserve the secret bytes
          # verbatim; `printf '%s'` would mis-handle embedded % (format
          # specifier) and truncate at any NUL byte. The signing key
          # lives in Forgejo's secret store rather than an HSM.
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          if [[ $TEST_BUILD == true ]]; then
            [[ -z $SIGNING_KEY ]] || { echo "a test build must not see the production key" >&2; exit 1; }
            cp "$RUNNER_TEMP/testkey/signing.key" "$RUNNER_TEMP/testkey/signing.crt" "$keydir/"
          else
            cat <<<"$SIGNING_KEY"  > "$keydir/signing.key"
            cat <<<"$SIGNING_CERT" > "$keydir/signing.crt"
          fi

          # Validate immediately. A malformed secret here produces a
          # clear "invalid PEM" error rather than a cryptic failure
          # inside sign-file/sbsign later.
          openssl pkey -in "$keydir/signing.key" -noout
          openssl x509 -in "$keydir/signing.crt" -noout

          # Publish the PUBLIC signing certificate in DER form so users can
          # enroll it via MOK. Secure Boot enrollment is a manual step (the
          # kernel .deb ships no auto-enroll postinst), so the cert must be
          # downloadable; it's attached to the release below. The private
          # key never leaves $keydir (the trap scrubs it at step end).
          openssl x509 -in "$keydir/signing.crt" -outform DER \
              -out "$WORKDIR/unredacted-hardened.der"

          SIGNING_KEY_PATH="$keydir/signing.key" \
          SIGNING_CERT_PATH="$keydir/signing.crt" \
            ./build/sign-debs.sh

      - name: record build provenance
        # Runs AFTER signing. For each signed .deb, strip the signing layer
        # back off (the same transform tools/repro-check.sh applies to an
        # independent rebuild) and record sha256 of the result as
        # unsigned_deb_sha256 — so the two sides are comparable. Also captures
        # a cheap SBOM (installed packages + toolchain). Assembles
        # WORKDIR/manifest.json in the schema repro-check.sh consumes;
        # publish.py appends publishes[] at publish time.
        env:
          KERNEL_VERSION: ${{ steps.ver.outputs.kernel }}
          HARDENED_REVISION: ${{ steps.ver.outputs.hardened }}
          HARDENED_BASE_VERSION: ${{ steps.ver.outputs.base }}
          FLAVOR: ${{ steps.flavor.outputs.name }}
          DISTRO: ${{ steps.flavor.outputs.distro }}
          RELEASE: ${{ steps.flavor.outputs.release }}
          ARCH: ${{ steps.flavor.outputs.arch }}
          SOURCE_DATE_EPOCH: ${{ steps.ver.outputs.source_date_epoch }}
          TEST_BUILD: ${{ steps.flavor.outputs.test_build }}
          SIGNING_CERT: ${{ github.event_name == 'push' && secrets.KERNEL_SIGNING_CERT || '' }}
          WORKDIR: ${{ runner.temp }}/work
          # Which CI run produced this release. Recorded for traceability: the
          # build used to compile github.run_number into KBUILD_BUILD_VERSION
          # (so into UTS_VERSION inside vmlinux) while repro-check.sh hard-coded
          # REVISION=1, which made a byte-identical rebuild impossible and left
          # no way to recover the real value. Manifests are append-only, so a
          # release built without this field can never gain it.
          CI_RUN_NUMBER: ${{ github.run_number }}
          # Keep this digest in sync with the job container image above.
          CONTAINER_IMAGE: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
        run: |
          set -euo pipefail
          repo="$(pwd)"
          export SOURCE_DATE_EPOCH
          # A test build records its throwaway certificate, like a rebuild.
          if [[ $TEST_BUILD == true ]]; then
            SIGNING_CERT=$(cat "$RUNNER_TEMP/testkey/signing.crt")
          fi
          cd "$WORKDIR"

          # Per-.deb canonical + key-independent hashes.
          #
          # Was: strip-signatures.sh then sha256 the result. That ends in
          # `dpkg-deb -b`, which RECOMPRESSES data.tar with the local
          # dpkg/liblzma defaults -- so the recorded hash depended on which
          # machine ran the strip. The build side ran it in this container,
          # repro-check.sh ran it on the bare host, and a verifier on any other
          # distro got a mismatch for every package including the ~800-byte
          # metas where the strip is a no-op. canonical-deb-hash.py never
          # repacks: pure-stdlib parse, canonicalize content, digest a sorted
          # description of the tree.
          python3 "$repo/tools/canonical-deb-hash.py" ./*.deb > deb-hashes.tsv
          echo "--- canonical hashes ---"
          cat deb-hashes.tsv

          # Cheap SBOM: build-container packages + toolchain versions.
          python3 "$repo/tools/sbom.py" "$WORKDIR/sbom.json"

          # --build-dir: the physical WORKDIR (we cd'd into it above). The
          # compiler embeds it in linux-headers' host tools and in -dbg, so
          # repro-check.sh must rebuild there; WORKDIR follows the runner's
          # temp dir, which is runner configuration, not ours.
          # --build-arch: this container's arch. A flavor of another arch is
          # cross-compiled here, and a native build of it differs, so
          # repro-check.sh must run the rebuild on the same one.
          python3 "$repo/tools/build-manifest.py" \
            --workdir "$WORKDIR" \
            --deb-hashes "$WORKDIR/deb-hashes.tsv" \
            --kernel-version "$KERNEL_VERSION" \
            --hardened-revision "$HARDENED_REVISION" \
            --hardened-base-version "$HARDENED_BASE_VERSION" \
            --container-image "$CONTAINER_IMAGE" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --build-dir "$(pwd -P)" \
            --build-arch "$(dpkg --print-architecture)" \
            --ci-run-number "$CI_RUN_NUMBER" \
            --flavor "$FLAVOR" \
            --distro "$DISTRO" --release "$RELEASE" --arch "$ARCH" \
            --signing-cert "$SIGNING_CERT" \
            --sbom "$WORKDIR/sbom.json" \
            --upstream-seed-info "$WORKDIR/seed-info.json"

      # TEST BUILD only: what would have been attached, for the run log.
      - name: test build summary
        if: steps.flavor.outputs.test_build == 'true'
        env:
          WORKDIR: ${{ runner.temp }}/work
          FULL_TAG: ${{ steps.flavor.outputs.tag }}
        run: |
          set -euo pipefail
          echo "TEST BUILD of $FULL_TAG (throwaway signing key; nothing attached or published)"
          ls -l "$WORKDIR"/*.deb
          sha256sum "$WORKDIR"/*.deb "$WORKDIR/final.config" "$WORKDIR/manifest.json"
          jq '{flavor, kernel_version, hardened_base_version, inputs, upstream_seed}' "$WORKDIR/manifest.json"

      - name: attach .debs to release
        # Forgejo's actions/upload-artifact support varies by version,
        # so we don't depend on it. Instead, attach the signed .debs as
        # release assets on the tag that triggered this build; publish.yml
        # fetches them from the release via the Forgejo API. Release
        # assets persist (workflow artifacts time out), which doubles as
        # an audit record. Never for a test build: there is no tag, and its
        # packages are signed with a key nothing trusts.
        if: steps.flavor.outputs.test_build != 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          WORKDIR: ${{ runner.temp }}/work
        run: |
          set -euo pipefail
          api="https://git.unredacted.org/api/v1/repos/${GITHUB_REPOSITORY}"

          # Create the release as a draft. If it already exists (e.g. a
          # rebuild of the same tag), fetch its id instead. The release
          # stays draft until an operator publishes it.
          rel=$(curl -sS -o /tmp/rel.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"draft\":true,\"name\":\"$TAG\"}" \
              "$api/releases")
          case "$rel" in
            201) ;;
            409|422)
              # Already exists (e.g. a same-tag rebuild). Resolve the id
              # from the releases LIST, which reliably includes our DRAFT
              # releases for a write-scoped token; GET /releases/tags/{tag}
              # has filtered drafts on some Forgejo versions, yielding a
              # null id that would fail an otherwise-valid rebuild.
              curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
                   "$api/releases?limit=50" \
                | jq --arg t "$TAG" 'map(select(.tag_name==$t)) | .[0]' \
                > /tmp/rel.json ;;
            *) echo "create release failed: HTTP $rel" >&2; cat /tmp/rel.json >&2; exit 1 ;;
          esac
          rel_id=$(jq -r '.id' /tmp/rel.json)
          [[ -n $rel_id && $rel_id != null ]] || { echo "no release id" >&2; exit 1; }

          upload_asset() {
            local path=$1 name=$2
            echo "uploading $name"
            curl -fsS -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -F "attachment=@$path" \
              "$api/releases/$rel_id/assets?name=$name" \
              > /dev/null
          }

          for deb in "$WORKDIR"/*.deb; do
            [[ -f $deb ]] || continue
            upload_asset "$deb" "$(basename "$deb")"
          done

          # Attach the final .config too, so publish.yml can commit it
          # into releases/{tag}/final.config for the next build's
          # new-symbol guard.
          if [[ -f $WORKDIR/final.config ]]; then
            upload_asset "$WORKDIR/final.config" "final.config"
          fi

          # Attach the provenance manifest. publish.yml downloads it, lets
          # publish.py append the publishes[] records, and commits it into
          # releases/{tag}/manifest.json — the input to tools/repro-check.sh.
          if [[ -f $WORKDIR/manifest.json ]]; then
            upload_asset "$WORKDIR/manifest.json" "manifest.json"
          fi

          # Attach the public signing certificate (DER) so users can enroll
          # it via MOK for Secure Boot (docs/users/secure-boot.md).
          if [[ -f $WORKDIR/unredacted-hardened.der ]]; then
            upload_asset "$WORKDIR/unredacted-hardened.der" "unredacted-hardened.der"
          fi
