name: repro-check
on:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC
  # Forgejo Actions does NOT support `workflow_run` (a GitHub-only event),
  # so chaining this off publish's completion silently never fired — only
  # the nightly cron ran. Use manual dispatch instead: an operator runs it
  # right after publish.yml to verify a fresh release, and the cron still
  # catches everything within 24h. Supported Forgejo events:
  # https://forgejo.org/docs/latest/user/actions/reference/
  workflow_dispatch:

jobs:
  repro:
    # Host-execution label (maps to `:host` in the runner config), NOT the
    # containerized `linux-hardened` label the build/sign/publish jobs use.
    # tools/repro-check.sh runs `docker run` to rebuild in the recorded
    # container image; running this job host-side (rather than inside a job
    # container with a mounted docker socket) avoids docker-in-docker AND
    # keeps repro-check.sh's `docker run -v "$repo_root:/repo:ro"` bind mount
    # correct — that path resolves on the same host the docker daemon runs on.
    # Keeping docker/host access on this separate label, off the signing path,
    # is deliberate. Host prerequisites are just docker + jq, installed once at
    # runner provisioning — see docs/operators/runner-setup.md. (sbsigntool and
    # diffoscope were required until the verdict stopped shelling out to
    # sbattach and diffoscope.)
    runs-on: linux-hardened-host
    steps:
      - uses: actions/checkout@v4

      - name: pick the most recent release directory
        id: rel
        run: |
          set -euo pipefail
          if [[ ! -d releases ]]; then
            echo "no releases/ directory — nothing to check"
            exit 0
          fi
          # Restrict to release-tag-shaped directory names. releases/ also holds
          # a README.md (not a dir, so already excluded), but an unfiltered
          # `find` would happily hand any directory name straight to
          # repro-check.sh as $version -- including one with whitespace or a
          # leading dash. Same grammar as build-kernel.yml's derive-version and
          # publish.yml's resolve-target steps; KEEP THE THREE IN SYNC.
          # amd64 releases only (no flavor tag prefix): this nightly check
          # rebuilds the newest amd64 release on this amd64 host. A pi5 release
          # (pi5-v...) is rebuilt by hand with tools/repro-check.sh, which
          # cross-compiles it.
          ver=$(find releases -maxdepth 1 -mindepth 1 -type d -printf '%f\n' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-fwd-v[0-9]+\.[0-9]+\.[0-9]+)?-hardened[1-9][0-9]*(\.[1-9][0-9]*)?$' \
              | sort -V | tail -n1 || true)
          if [[ -z $ver ]]; then
            echo "releases/ has no release-tag-shaped directories — nothing to check"
            exit 0
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Host execution: prerequisites are pre-installed on the runner host
      # (not apt-installed per-run, since the job runs directly on the host,
      # not in a disposable container). Verify them up front with a clear
      # message rather than failing deep in repro-check.sh. diffoscope is
      # optional (repro-check degrades to a hash-only report without it).
      - name: check host prerequisites
        if: steps.rel.outputs.version != ''
        run: |
          set -euo pipefail
          missing=""
          for t in docker jq; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::linux-hardened-host runner is missing required tools:$missing" >&2
            echo "install them on the host (see docs/operators/runner-setup.md)" >&2
            exit 1
          fi
          # sbattach and diffoscope are no longer needed: the verdict parses
          # .debs in pure Python (tools/canonical-deb-hash.py) and reports the
          # differing archive member directly.

      - name: run repro check
        id: repro
        if: steps.rel.outputs.version != ''
        # Via env: rather than spliced into the run: line -- a template is
        # substituted into the script text before bash parses it, so the
        # quotes around it are no protection. See validate.yml's
        # workflow-expressions job.
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: ./tools/repro-check.sh "$VERSION"

      # Only upload when the repro step itself produced a diff. If an
      # earlier step (install, checkout) failed there is no diff to
      # upload, and `failure()` alone would fire a misleading
      # "no files found" warning.
      - name: upload diff report on failure
        if: steps.repro.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: repro-diff-${{ steps.rel.outputs.version }}
          path: repro-diff/
          retention-days: 30
