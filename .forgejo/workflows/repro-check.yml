name: repro-check
on:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC
  workflow_run:
    workflows: ["publish"]
    types: [completed]

jobs:
  repro:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4

      - name: pick the most recent release directory
        id: rel
        run: |
          set -euo pipefail
          if [[ ! -d releases ]]; then
            echo "no releases/ directory — nothing to check"
            exit 0
          fi
          ver=$(find releases -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort -V | tail -n1)
          if [[ -z $ver ]]; then
            echo "releases/ is empty — nothing to check"
            exit 0
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Runner runs as root; no sudo (same pattern as cve-watch.yml /
      # publish.yml / validate.yml).
      - name: install diff tools
        if: steps.rel.outputs.version != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq diffoscope

      - name: run repro check
        id: repro
        if: steps.rel.outputs.version != ''
        run: ./tools/repro-check.sh "${{ steps.rel.outputs.version }}"

      # Only upload when the repro step itself produced a diff. If an
      # earlier step (install, checkout) failed there is no diff to
      # upload, and `failure()` alone would fire a misleading
      # "no files found" warning.
      - name: upload diff report on failure
        if: steps.repro.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: repro-diff-${{ steps.rel.outputs.version }}
          path: repro-diff/
          retention-days: 30
