name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      # Forgejo's act-based runner runs jobs as root inside node:22-bookworm.
      # `sudo` isn't installed; use apt-get directly.
      - run: apt-get update && apt-get install -y shellcheck
      - run: shellcheck build/*.sh tools/*.sh

  yamllint:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y yamllint
      - run: yamllint -d relaxed .forgejo/workflows/

  workflow-expressions:
    # Forgejo's expression preprocessor scans the ENTIRE run: script -- shell
    # comments included -- for double-curly expression templates. An empty one,
    # or a malformed one written illustratively inside a comment, makes the
    # whole workflow fail to LOAD with a cryptic "unexpected end of input"
    # schema error. yamllint can't catch it (the file is valid YAML), so guard
    # here -- this is exactly what once broke cve-watch.yml. Reword such
    # comments to describe the template rather than writing its literal syntax
    # (as these very comments and messages do, to avoid tripping on this file).
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: no empty or commented workflow expressions
        run: |
          set -euo pipefail
          fails=0
          # Empty template: opening double-curly, only whitespace, closing.
          if grep -RnE '\$\{\{[[:space:]]*\}\}' .forgejo/workflows/; then
            echo "::error::empty expression template(s) above fail Forgejo's parser" >&2
            fails=1
          fi
          # A live template inside a shell comment -- the preprocessor still
          # evaluates it regardless of the leading '#'.
          if grep -RnE '^[[:space:]]*#.*\$\{\{' .forgejo/workflows/; then
            echo "::error::expression template inside a comment above; reword it" >&2
            fails=1
          fi
          # A template anywhere inside a run: script body. The preprocessor
          # splices the VALUE into the script text before bash parses it, so a
          # value containing a double quote, backtick, $(...) or ; is executable
          # shell -- in jobs that hold KERNEL_SIGNING_KEY (build-kernel.yml) or
          # every publish credential and the push-to-main token (publish.yml).
          # Pass values through env: and reference them as shell variables; an
          # env var's value is never re-scanned by the shell parser.
          #
          # Rule: a template may appear ONLY as a YAML mapping value. So find
          # every templated line and subtract the ones shaped like `key: value`
          # or `- key: value`; whatever is left sits in a run: body. A shell
          # line such as `echo "tag: $X"` does not match the subtraction
          # pattern, because that requires the colon immediately after a
          # leading identifier.
          tmpl='\$\{\{'
          if grep -RnE "$tmpl" .forgejo/workflows/ \
              | grep -vE ':[0-9]+:[[:space:]]*(-[[:space:]]+)?[A-Za-z_][A-Za-z0-9_.-]*:[[:space:]]'; then
            echo "::error::expression template inside a run: body above; pass it via env: instead" >&2
            fails=1
          fi
          # ...and a one-line `run: echo <template>` satisfies the rule above
          # (it IS a mapping value), so reject that shape explicitly.
          if grep -RnE "^[[:space:]]*run:.*$tmpl" .forgejo/workflows/; then
            echo "::error::expression template on a run: line above; pass it via env: instead" >&2
            fails=1
          fi
          if [[ $fails -ne 0 ]]; then exit 1; fi
          echo "workflow expressions OK"

  pycompile:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/*.py
      # py_compile only proves the files parse. The doctests in prune.py cover
      # parse_version and select_versions_to_archive -- the function that
      # decides what gets DELETED, including the .P-rebuild handling and the
      # per-line sunset knob. They existed (for parse_version) and had never
      # been run by anything.
      - run: python3 -m doctest tools/prune.py tools/lines.py tools/flavors.py tools/source-delta.py tools/apt-index.py
      # Smoke-test the line registry: py_compile does not prove
      # configs/lines.toml parses, and lines.py raises on a malformed registry
      # (two stable lines, a bad series). Without this, a broken registry
      # surfaces only when seed-bump.yml or a build runs.
      - run: python3 tools/lines.py stable-series
      # Same for the flavor descriptors (configs/flavors/*.toml): schema,
      # intent fragments (exist, start with the common one, no symbol pinned
      # twice within a flavor, none merged by no flavor), cross-flavor
      # uniqueness of tag prefix and localversion, each flavor's line set has a
      # stable line, and nothing this pipeline cannot build yet. build-kernel.yml
      # runs the same check before it builds.
      - run: python3 tools/flavors.py validate
      # The pins of the flavors that do not build from kernel.org + anthraxx's
      # Arch packaging (configs/sources/<set>/, configs/seeds/<set>/): every
      # registered line has them, by convention, well-formed and in the
      # line's series, with the source pin's committed delta and the seed
      # pin's keyring present. fetch-sources.sh / fetch-seed.sh read them
      # through the same validator.
      - run: python3 tools/pins.py validate
      # build-kernel.yml triggers on one tag glob per flavor. A flavor whose
      # prefix is missing there would have its tags silently never built; a
      # stale glob would start builds no flavor accepts.
      - name: build-kernel.yml triggers on every flavor's tags
        run: |
          set -euo pipefail
          want=$(python3 tools/flavors.py tag-globs)
          # The one `tags: [...]` flow list under on.push (no YAML parser in
          # this job's image).
          line=$(grep -E "^[[:space:]]+tags:[[:space:]]*\[" .forgejo/workflows/build-kernel.yml)
          [[ $(grep -cE "^[[:space:]]+tags:" .forgejo/workflows/build-kernel.yml) == 1 ]] || {
            echo "::error::expected exactly one tags: line in build-kernel.yml" >&2; exit 1; }
          got=$(grep -oE "'[^']+'" <<<"$line" | tr -d "'" | LC_ALL=C sort)
          want=$(LC_ALL=C sort <<<"$want")
          if [[ -z $got || $want != "$got" ]]; then
            echo "::error::build-kernel.yml push tags differ from tools/flavors.py tag-globs:" >&2
            diff <(echo "$want") <(echo "$got") >&2 || true
            exit 1
          fi
          echo "tag triggers OK: $(echo "$want" | tr '\n' ' ')"

  intent-matches-policy:
    # Bidirectional parity between the intent fragments (the project's
    # pinned kconfig overrides layered over the seed: configs/intent.common.config
    # plus the per-architecture configs/intent.<arch>.config, as the flavor
    # descriptors in configs/flavors/ list them) and configs/POLICY.md (the
    # prose audit trail). Every kconfig assertion in POLICY must appear as a
    # setting line in one of the fragments with the declared value; every
    # setting line in every fragment must have its symbol mentioned (as a
    # CONFIG_ token) in POLICY. A mismatch means the docs and the operational
    # intent drifted -- one or the other needs updating before merge.
    #
    # The fragments are checked as their UNION, the same set the build's
    # fidelity assertion checks for a flavor. (Which fragment holds a pin is
    # tools/flavors.py's concern: it rejects a symbol pinned twice within a
    # flavor, and a fragment no flavor merges.)
    #
    # The seed itself is never checked here (the seed is what it is; the
    # build's fidelity assertion handles "did our intent actually land"
    # at configure time).
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: intent fragments and POLICY.md agree
        run: |
          set -euo pipefail
          POLICY=configs/POLICY.md
          [[ -f $POLICY ]] || { echo "missing $POLICY" >&2; exit 1; }
          # Every fragment any flavor merges. A failing flavors.py fails the
          # step here (command substitution in an assignment), rather than
          # yielding an empty list that a loop would silently skip.
          frag_list=$(python3 tools/flavors.py fragments)
          frags=()
          while IFS= read -r f; do
              [[ -n $f ]] && frags+=("$f")
          done <<<"$frag_list"
          if (( ${#frags[@]} == 0 )); then
              echo "no intent fragments listed by any flavor descriptor" >&2
              exit 1
          fi
          for f in "${frags[@]}"; do
              [[ -f $f ]] || { echo "missing $f" >&2; exit 1; }
          done
          echo "intent fragments: ${frags[*]}"
          INTENT=$(mktemp)
          trap 'rm -f "$INTENT"' EXIT
          cat "${frags[@]}" > "$INTENT"

          fails=0

          # --- Direction 1: every POLICY assertion exists in the intent ---
          # POLICY uses backtick-wrapped kconfig assertions:
          #   `CONFIG_X=value`         -> expect that exact line in intent
          #   `# CONFIG_X is not set`  -> expect symbol off in intent
          #   `CONFIG_X=n`             -> POLICY prose shorthand for "off"
          check_intent_set() {
              local sym=$1 want=$2
              if [[ $want == n ]]; then check_intent_off "$sym"; return; fi
              local have
              have=$(grep -E "^${sym}=" "$INTENT" | head -n1)
              if [[ "$have" != "${sym}=${want}" ]]; then
                  printf '  MISMATCH (POLICY->intent): POLICY asserts %s=%s, intent has: %s\n' \
                      "$sym" "$want" "${have:-<absent>}" >&2
                  fails=$((fails+1))
              fi
          }
          check_intent_off() {
              local sym=$1
              if grep -qE "^${sym}=" "$INTENT"; then
                  printf '  MISMATCH (POLICY->intent): POLICY asserts %s off, intent has: %s\n' \
                      "$sym" "$(grep "^${sym}=" "$INTENT" | head -n1)" >&2
                  fails=$((fails+1))
              fi
              # Absent or "# X is not set" both satisfy "off" — both fine.
          }

          while IFS= read -r raw; do
              spec=${raw#\`}; spec=${spec%\`}
              check_intent_set "${spec%%=*}" "${spec#*=}"
          done < <(grep -oE '`CONFIG_[A-Z0-9_]+=[^`]*`' "$POLICY" | sort -u)

          while IFS= read -r raw; do
              sym=$(printf '%s' "$raw" | sed -E 's/^`# (CONFIG_[A-Z0-9_]+) is not set`$/\1/')
              check_intent_off "$sym"
          done < <(grep -oE '`# CONFIG_[A-Z0-9_]+ is not set`' "$POLICY" | sort -u)

          # --- Direction 2: every intent symbol mentioned in POLICY ---
          # Catches the converse: we pinned a symbol in intent without a
          # POLICY rationale entry. Tolerates POLICY mentioning the symbol
          # ANYWHERE (heading or prose) since we only need the rationale
          # to exist; the exact value comes from intent itself.
          intent_syms=$(sed -nE \
              -e 's/^(CONFIG_[A-Z0-9_]+)=.*/\1/p' \
              -e 's/^# (CONFIG_[A-Z0-9_]+) is not set$/\1/p' "$INTENT" | sort -u)
          policy_syms=$(grep -oE 'CONFIG_[A-Z0-9_]+' "$POLICY" | sort -u)
          # Guard against a vacuous pass: an empty intent_syms (malformed or
          # empty fragments) would make `comm` find no orphans and this
          # direction pass silently. (The comparison itself is exact — comm
          # matches whole symbols, so CONFIG_X is never "covered" by a
          # longer CONFIG_X_Y.)
          if [[ -z $intent_syms ]]; then
              echo "  no CONFIG_ symbols parsed from ${frags[*]} (malformed/empty?)" >&2
              fails=$((fails+1))
          fi
          orphans=$(comm -23 <(echo "$intent_syms") <(echo "$policy_syms"))
          if [[ -n $orphans ]]; then
              echo "  intent symbols with no POLICY mention:" >&2
              echo "$orphans" | sed 's/^/    /' >&2
              fails=$((fails+1))
          fi

          if (( fails > 0 )); then
              echo "$fails parity check(s) failed between ${frags[*]} and $POLICY" >&2
              exit 1
          fi
          echo "intent fragments (${frags[*]}) and POLICY.md agree"

  dep-list-parity:
    # The kernel-build apt dep list is hand-maintained in THREE places that
    # must stay consistent or a build done in one environment won't reproduce
    # in another:
    #   - .forgejo/workflows/build-kernel.yml  ("install build deps" step)
    #   - containers/Dockerfile.runner-trixie-amd64  (the pre-built runner image)
    #   - tools/repro-check.sh  (its inline rebuild deps)
    # The first two must be IDENTICAL (wiring in the runner image is a no-op
    # swap). repro-check.sh intentionally omits a known subset (nodejs for JS
    # actions, sbsigntool for signing, jq/curl used only by the workflow, not
    # the rebuild). This guards both invariants so the "keep in sync" comments
    # can't silently rot.
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: build-deps consistent across the three locations
        run: |
          set -euo pipefail
          # Extract the explicit hand-install package set: the apt-get install
          # --no-install-recommends block that ends at 'devscripts'. Ignores
          # the separate build-dep + gcc-plugin installs and apt boilerplate.
          extract_deps() {
            awk '
              /apt-get[ \t]+install/ && /--no-install-recommends/ { cap=1 }
              cap {
                line=$0
                gsub(/[\;]/, " ", line)
                n=split(line, t, /[ \t]+/)
                for (i=1;i<=n;i++) {
                  tok=t[i]
                  if (tok ~ /^[a-z0-9][a-z0-9.+-]*$/ && tok != "apt-get" \
                      && tok != "install" && tok != "update" \
                      && tok != "linux" && tok != "build-dep") print tok
                }
                if (line ~ /devscripts/) exit
              }' "$1" | sort -u
          }
          bk=$(extract_deps .forgejo/workflows/build-kernel.yml)
          df=$(extract_deps containers/Dockerfile.runner-trixie-amd64)
          rc=$(extract_deps tools/repro-check.sh)

          # Guard against a vacuous pass if an anchor changes and extraction
          # silently yields nothing.
          for pair in "build-kernel:$bk" "dockerfile:$df" "repro-check:$rc"; do
            name=${pair%%:*}; val=${pair#*:}
            if [[ -z $val ]]; then
              echo "::error::extracted EMPTY dep list for $name (anchor changed?)" >&2
              exit 1
            fi
          done

          fails=0
          # 1. build-kernel.yml and the runner Dockerfile must be identical.
          if ! diff <(echo "$bk") <(echo "$df") >/dev/null; then
            echo "::error::build-kernel.yml and Dockerfile.runner dep lists differ:" >&2
            diff <(echo "$bk") <(echo "$df") >&2 || true
            fails=1
          fi
          # 2. build-kernel MINUS repro-check must be EXACTLY the known subset.
          EXPECTED_OMITTED="curl jq nodejs sbsigntool"
          got=$(comm -23 <(echo "$bk") <(echo "$rc") | tr '\n' ' ' | xargs || true)
          if [[ "$got" != "$EXPECTED_OMITTED" ]]; then
            echo "::error::repro-check.sh dep subset drifted." >&2
            echo "  build-kernel minus repro-check = [$got]" >&2
            echo "  expected exactly               = [$EXPECTED_OMITTED]" >&2
            fails=1
          fi
          # 3. repro-check must not ADD a package build-kernel lacks.
          extra=$(comm -13 <(echo "$bk") <(echo "$rc") || true)
          if [[ -n $extra ]]; then
            echo "::error::repro-check.sh has packages absent from build-kernel.yml:" >&2
            echo "$extra" | sed 's/^/    /' >&2
            fails=1
          fi
          if (( fails > 0 )); then exit 1; fi
          echo "dep-list parity OK ($(echo "$bk" | wc -l | xargs) pkgs; repro-check omits: $EXPECTED_OMITTED)"

  seed-pins-well-formed:
    # (This job covers amd64's arch-git seeds, configs/seeds/<X.Y>.toml. The
    # pins of other line sets, configs/seeds/<set>/ and configs/sources/<set>/,
    # have their own schema and are checked by `tools/pins.py validate` in the
    # pycompile job; the registry check at the end covers every set.)
    #
    # Each configs/seeds/<X.Y>.toml pins one upstream config seed. Three
    # invariants that nothing else checks, all cheap and all deterministic:
    #
    #   1. The pinned `tag` belongs to the SAME series as the filename. This is
    #      the check that would have caught the cross-series pin: seeds/7.1.toml
    #      spent four releases pinned to a 7.0.12 config while its own header
    #      comment claimed anthraxx had not published a 7.1 config yet. A
    #      cross-series seed is sometimes legitimate (a line stood up before
    #      upstream packages it), so the escape hatch is a marker comment in the
    #      file rather than a workflow variable -- it belongs with the pin.
    #   2. All six keys present, `commit` 40 hex, `sha256` 64 hex. A truncated
    #      or half-edited pin should fail here, not deep in a build.
    #   3. configs/upstream-seed.toml resolves to the stable line's seed file.
    #      Repointing that symlink is a documented manual step when advancing
    #      the line (configs/lines.toml's header says so) and was unchecked.
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: seed pins are well-formed
        run: |
          set -euo pipefail
          fails=0
          examined=0
          for f in configs/seeds/*.toml; do
              [[ -f $f ]] || continue
              examined=$((examined+1))
              series=$(basename "$f" .toml)
              get() { sed -nE "s/^$1[[:space:]]*=[[:space:]]*\"([^\"]*)\".*/\1/p" "$f" | head -n1; }
              for k in url commit tag config_path sha256 signer_fpr; do
                  if [[ -z $(get "$k") ]]; then
                      echo "  $f: missing or unparseable key '$k'" >&2
                      fails=$((fails+1))
                  fi
              done
              [[ $(get commit) =~ ^[0-9a-f]{40}$ ]] || {
                  echo "  $f: commit is not a 40-hex sha1: $(get commit)" >&2; fails=$((fails+1)); }
              [[ $(get sha256) =~ ^[0-9a-f]{64}$ ]] || {
                  echo "  $f: sha256 is not 64 hex: $(get sha256)" >&2; fails=$((fails+1)); }
              # Series agreement, unless the file explicitly declares itself a
              # cross-series stopgap with a `# cross-series-seed: <reason>` line.
              tag=$(get tag)
              if [[ $tag != "$series".* ]] && ! grep -qE '^# cross-series-seed:' "$f"; then
                  echo "  $f: pinned tag '$tag' is not from series $series." >&2
                  echo "    A cross-series seed sets every UN-pinned hardening default from" >&2
                  echo "    the wrong line. If that is intended (the line was stood up before" >&2
                  echo "    anthraxx packaged a config for it), add a line to $f reading:" >&2
                  echo "      # cross-series-seed: <why, and when it can be bumped>" >&2
                  fails=$((fails+1))
              fi
          done
          # Vacuity guard: a glob that matched nothing would report success.
          if (( examined == 0 )); then
              echo "  no configs/seeds/*.toml examined — wrong path, or the glob did not expand" >&2
              fails=$((fails+1))
          fi
          # The legacy symlink must track the stable line.
          stable=$(python3 tools/lines.py stable-series)
          want="seeds/${stable}.toml"
          got=$(readlink configs/upstream-seed.toml || true)
          if [[ $got != "$want" ]]; then
              echo "  configs/upstream-seed.toml -> '${got:-<not a symlink>}', expected '$want'" >&2
              echo "    Repointing it is a manual step when advancing the stable line." >&2
              fails=$((fails+1))
          fi
          # And every registered line's declared seed must satisfy lines.py's
          # convention + existence assertions (tools/lines.py seed_path_for).
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import lines
          bad = 0
          for ln in lines.load():
              try:
                  lines.seed_path_for(ln["series"], flavor=lines.flavor_of(ln))
              except ValueError as e:
                  print(f"  {e}", file=sys.stderr)
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
          if (( fails > 0 )); then
              echo "$fails seed-pin problem(s)" >&2
              exit 1
          fi
          echo "seed pins OK ($examined file(s) examined; symlink -> $want)"

  workflow-shell:
    # The shellcheck job above covers build/*.sh and tools/*.sh. The largest and
    # least-tested body of shell in this repo is in workflow `run:` blocks --
    # cve-watch.yml alone is ~150 lines with jq, comm, an api_call helper and
    # pipefail interactions -- and nothing checked it. A parse error there
    # surfaces only when that job actually runs, which for cve-watch or prune
    # could be weeks later, possibly mid-CVE-response.
    #
    # Gated at severity=error: 43 inline scripts, 0 findings today, so this lands
    # green and stays a real signal rather than a wall of style noise. Higher
    # levels are available locally and the backlog is small and honest:
    # `--severity warning` reports 1, `--severity info` reports 3. Raise the gate
    # when those are cleared.
    #
    # One deliberate interaction: the linter substitutes a placeholder for each
    # runner expression template (a raw template is not valid shell), so
    # comparing a template in a run: body shows up as SC2050 "this expression is
    # constant". That is not noise -- it means a template is being used where the
    # workflow-expressions job now requires an env: variable, so the two checks
    # reinforce each other.
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends shellcheck python3-yaml
      - run: python3 tools/lint-workflow-shell.py --severity error

  escape-hatches-are-plumbed:
    # A repo variable only reaches a script if the step that runs it lists the
    # name in `env:`. Nothing enforced that, and the result was a documented
    # override that did nothing: check-hardening-drift.sh honoured
    # ALLOW_HARDENING_REGRESSION, POLICY.md and config-architecture.md both told
    # the operator to set it, and the drift step's env: block listed only
    # WORKDIR and SERIES. The operator's only remaining route past a drift
    # failure was a commit to main -- which the stale-tag guard then turns into
    # "delete and re-cut the tag", mid-CVE-SLA.
    #
    # This is the check that closes that class permanently. Note a workflow-shell
    # linter would NOT have caught it: a missing YAML env: key involves no shell.
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: every ALLOW_*/REQUIRE_* hatch is plumbed and documented
        run: |
          set -euo pipefail
          # Names the scripts and workflow bodies actually read.
          names=$(grep -rhoE '\$\{(ALLOW|REQUIRE)_[A-Z0-9_]+:-' \
                    build/ tools/ .forgejo/workflows/ \
                  | sed -E 's/^\$\{//; s/:-$//' | sort -u)
          # Vacuity guard, same shape as the other jobs here: an extraction that
          # silently found nothing would make this pass without checking.
          count=$(printf '%s' "$names" | grep -c . || true)
          if (( count < 3 )); then
            echo "::error::found only $count ALLOW_*/REQUIRE_* names (expected >= 3);" >&2
            echo "::error::the extraction pattern is probably broken." >&2
            exit 1
          fi
          fails=0
          for n in $names; do
            # Built as a pattern rather than written literally, so this job never
            # contains an expression template of its own (which would trip the
            # workflow-expressions job above).
            if ! grep -rqE "vars\\.$n" .forgejo/workflows/; then
              echo "  $n is read by a script but no workflow passes it via env: vars.$n" >&2
              fails=$((fails+1))
            fi
            if ! grep -rq "$n" docs/operators/ configs/POLICY.md; then
              echo "  $n is not documented in docs/operators/ or configs/POLICY.md" >&2
              fails=$((fails+1))
            fi
          done
          if (( fails > 0 )); then
            echo "$fails escape-hatch problem(s)" >&2
            exit 1
          fi
          echo "escape hatches OK ($count: $(echo "$names" | tr '\n' ' '))"

  container-digests-pinned:
    # Replaces `no-placeholder-digests`, which could no longer fail: it grepped
    # containers/ for the placeholder token, and that token now appears ONLY in
    # shim/Dockerfile -- which the job deliberately excludes. A check that
    # cannot fail is worse than no check, because it reads as coverage.
    #
    # Inverted to a POSITIVE assertion, which cannot go dormant: every FROM under
    # containers/ must carry a concrete @sha256 digest. The shim track is
    # unbuilt, so shim/Dockerfile keeps its placeholder and stays out of scope.
    #
    # Also enforces the digest-sync comment at build-kernel.yml's CONTAINER_IMAGE
    # ("Keep this digest in sync with the job container image above"), which was
    # pure convention. They agree today; if they ever diverge, every manifest
    # records a build environment the build did not use, and repro-check
    # faithfully rebuilds in an image that never produced the release --
    # mismatches that look like tampering.
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: container FROMs are digest-pinned
        run: |
          set -euo pipefail
          fails=0
          examined=0
          for f in containers/Dockerfile*; do
            [[ -f $f ]] || continue
            while IFS= read -r line; do
              examined=$((examined+1))
              if [[ ! $line =~ @sha256:[0-9a-f]{64}([[:space:]]|$) ]]; then
                echo "  $f: FROM is not digest-pinned: $line" >&2
                fails=$((fails+1))
              fi
            done < <(grep -E '^[[:space:]]*FROM[[:space:]]' "$f")
          done
          if (( examined == 0 )); then
            echo "::error::no FROM lines examined under containers/ — wrong path?" >&2
            exit 1
          fi
          # build-kernel.yml's job container vs the digest recorded in manifests.
          job_img=$(grep -oE 'image: debian:[a-z]+@sha256:[0-9a-f]{64}' \
                      .forgejo/workflows/build-kernel.yml | head -n1 | sed 's/^image: //')
          rec_img=$(grep -oE 'CONTAINER_IMAGE: debian:[a-z]+@sha256:[0-9a-f]{64}' \
                      .forgejo/workflows/build-kernel.yml | head -n1 | sed 's/^CONTAINER_IMAGE: //')
          if [[ -z $job_img || -z $rec_img ]]; then
            echo "::error::could not extract both the job container image and CONTAINER_IMAGE" >&2
            echo "::error::(job='$job_img' recorded='$rec_img'); the patterns need updating." >&2
            exit 1
          fi
          if [[ $job_img != "$rec_img" ]]; then
            echo "  build-kernel.yml: the job container and the recorded CONTAINER_IMAGE differ:" >&2
            echo "    container.image  : $job_img" >&2
            echo "    CONTAINER_IMAGE  : $rec_img" >&2
            echo "  Every manifest would record a build environment the build did not use." >&2
            fails=$((fails+1))
          fi
          if (( fails > 0 )); then echo "$fails digest problem(s)" >&2; exit 1; fi
          echo "container digests OK ($examined FROM line(s); build image == recorded image)"
