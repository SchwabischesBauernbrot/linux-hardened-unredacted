name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      # Forgejo's act-based runner runs jobs as root inside node:22-bookworm.
      # `sudo` isn't installed; use apt-get directly.
      - run: apt-get update && apt-get install -y shellcheck
      - run: shellcheck build/*.sh tools/*.sh

  yamllint:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y yamllint
      - run: yamllint -d relaxed .forgejo/workflows/

  pycompile:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/*.py

  policy-matches-config:
    # POLICY.md is the trust narrative; configs/config.${target} is the
    # authoritative operational truth (the full ~9.5k-line .config the
    # build cp's in). Every explicit assertion POLICY makes about a symbol
    # must hold in the authoritative -- otherwise the docs are lying about
    # what the kernel actually ships with. The reverse direction is not
    # checked: the authoritative has thousands of symbols POLICY does not
    # (and need not) document; POLICY covers the curated set of choices
    # where we take an intentional position.
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: every POLICY assertion holds in the authoritative config
        run: |
          set -euo pipefail
          AUTH=configs/config.debian-trixie-amd64
          [[ -f $AUTH ]] || { echo "missing authoritative config: $AUTH" >&2; exit 1; }

          # POLICY documents intent via backtick-wrapped kconfig assertions
          # in headings and prose:
          #   `CONFIG_X=value`         -> expect that exact line in $AUTH
          #   `# CONFIG_X is not set`  -> expect symbol off (absent or
          #                               literally "is not set") in $AUTH
          # A mismatch means POLICY drifted from the config (or vice
          # versa); one or the other is wrong.
          fails=0
          check_set() {
              local sym=$1 want=$2
              # `CONFIG_X=n` in POLICY prose is shorthand for "off"; the
              # kconfig wire format is "# CONFIG_X is not set" (or absent).
              # Treat them equivalently.
              if [[ $want == n ]]; then check_off "$sym"; return; fi
              local have
              have=$(grep -E "^${sym}=" "$AUTH" | head -n1)
              if [[ "$have" != "${sym}=${want}" ]]; then
                  printf '  MISMATCH: POLICY asserts %s=%s, authoritative has: %s\n' \
                      "$sym" "$want" "${have:-<absent>}" >&2
                  fails=$((fails+1))
              fi
          }
          check_off() {
              local sym=$1
              if grep -qE "^${sym}=" "$AUTH"; then
                  printf '  MISMATCH: POLICY asserts %s off, authoritative has: %s\n' \
                      "$sym" "$(grep "^${sym}=" "$AUTH" | head -n1)" >&2
                  fails=$((fails+1))
              fi
          }

          while IFS= read -r raw; do
              spec=${raw#\`}; spec=${spec%\`}
              check_set "${spec%%=*}" "${spec#*=}"
          done < <(grep -oE '`CONFIG_[A-Z0-9_]+=[^`]*`' configs/POLICY.md | sort -u)

          while IFS= read -r raw; do
              sym=$(printf '%s' "$raw" | sed -E 's/^`# (CONFIG_[A-Z0-9_]+) is not set`$/\1/')
              check_off "$sym"
          done < <(grep -oE '`# CONFIG_[A-Z0-9_]+ is not set`' configs/POLICY.md | sort -u)

          if (( fails > 0 )); then
              echo "$fails POLICY assertion(s) do not match $AUTH" >&2
              exit 1
          fi
          echo "all POLICY assertions match $AUTH"

  no-placeholder-digests:
    # Pin placeholders must be replaced with concrete digests before a
    # Phase 1 build. This job runs on push to main only; Phase 0 PRs can
    # carry the placeholder so the scaffold builds at all.
    #
    # Scope is narrow: only Dockerfiles under containers/ (where the
    # build actually uses the digest). The shim track is intentionally
    # blocked, so shim/Dockerfile's placeholder is accepted. Docs and
    # workflow YAML are excluded so example commands and the validator's
    # own grep pattern don't trip the check.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          if grep -RnE 'sha256:REPLACE_WITH_CONCRETE_DIGEST' \
                --include='Dockerfile*' \
                containers/; then
            echo "placeholder digest(s) remain in containers/; pin before publishing" >&2
            exit 1
          fi
