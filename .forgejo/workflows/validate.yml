name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      # Forgejo's act-based runner runs jobs as root inside node:22-bookworm.
      # `sudo` isn't installed; use apt-get directly.
      - run: apt-get update && apt-get install -y shellcheck
      - run: shellcheck build/*.sh tools/*.sh

  yamllint:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y yamllint
      - run: yamllint -d relaxed .forgejo/workflows/

  workflow-expressions:
    # Forgejo's expression preprocessor scans the ENTIRE run: script -- shell
    # comments included -- for double-curly expression templates. An empty one,
    # or a malformed one written illustratively inside a comment, makes the
    # whole workflow fail to LOAD with a cryptic "unexpected end of input"
    # schema error. yamllint can't catch it (the file is valid YAML), so guard
    # here -- this is exactly what once broke cve-watch.yml. Reword such
    # comments to describe the template rather than writing its literal syntax
    # (as these very comments and messages do, to avoid tripping on this file).
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: no empty or commented workflow expressions
        run: |
          set -euo pipefail
          fails=0
          # Empty template: opening double-curly, only whitespace, closing.
          if grep -RnE '\$\{\{[[:space:]]*\}\}' .forgejo/workflows/; then
            echo "::error::empty expression template(s) above fail Forgejo's parser" >&2
            fails=1
          fi
          # A live template inside a shell comment -- the preprocessor still
          # evaluates it regardless of the leading '#'.
          if grep -RnE '^[[:space:]]*#.*\$\{\{' .forgejo/workflows/; then
            echo "::error::expression template inside a comment above; reword it" >&2
            fails=1
          fi
          if [[ $fails -ne 0 ]]; then exit 1; fi
          echo "workflow expressions OK"

  pycompile:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/*.py

  intent-matches-policy:
    # Bidirectional parity between configs/intent.config (the project's
    # pinned kconfig overrides layered over anthraxx's seed) and
    # configs/POLICY.md (the prose audit trail). Every kconfig assertion
    # in POLICY must appear as a setting line in intent.config with the
    # declared value; every setting line in intent.config must have its
    # symbol mentioned (as a CONFIG_ token) in POLICY. A mismatch means
    # the docs and the operational intent drifted -- one or the other
    # needs updating before merge.
    #
    # The seed itself is never checked here (the seed is what it is; the
    # build's fidelity assertion handles "did our intent actually land"
    # at configure time).
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: intent.config and POLICY.md agree
        run: |
          set -euo pipefail
          INTENT=configs/intent.config
          POLICY=configs/POLICY.md
          [[ -f $INTENT ]] || { echo "missing $INTENT" >&2; exit 1; }
          [[ -f $POLICY ]] || { echo "missing $POLICY" >&2; exit 1; }

          fails=0

          # --- Direction 1: every POLICY assertion exists in intent.config ---
          # POLICY uses backtick-wrapped kconfig assertions:
          #   `CONFIG_X=value`         -> expect that exact line in intent
          #   `# CONFIG_X is not set`  -> expect symbol off in intent
          #   `CONFIG_X=n`             -> POLICY prose shorthand for "off"
          check_intent_set() {
              local sym=$1 want=$2
              if [[ $want == n ]]; then check_intent_off "$sym"; return; fi
              local have
              have=$(grep -E "^${sym}=" "$INTENT" | head -n1)
              if [[ "$have" != "${sym}=${want}" ]]; then
                  printf '  MISMATCH (POLICY->intent): POLICY asserts %s=%s, intent has: %s\n' \
                      "$sym" "$want" "${have:-<absent>}" >&2
                  fails=$((fails+1))
              fi
          }
          check_intent_off() {
              local sym=$1
              if grep -qE "^${sym}=" "$INTENT"; then
                  printf '  MISMATCH (POLICY->intent): POLICY asserts %s off, intent has: %s\n' \
                      "$sym" "$(grep "^${sym}=" "$INTENT" | head -n1)" >&2
                  fails=$((fails+1))
              fi
              # Absent or "# X is not set" both satisfy "off" — both fine.
          }

          while IFS= read -r raw; do
              spec=${raw#\`}; spec=${spec%\`}
              check_intent_set "${spec%%=*}" "${spec#*=}"
          done < <(grep -oE '`CONFIG_[A-Z0-9_]+=[^`]*`' "$POLICY" | sort -u)

          while IFS= read -r raw; do
              sym=$(printf '%s' "$raw" | sed -E 's/^`# (CONFIG_[A-Z0-9_]+) is not set`$/\1/')
              check_intent_off "$sym"
          done < <(grep -oE '`# CONFIG_[A-Z0-9_]+ is not set`' "$POLICY" | sort -u)

          # --- Direction 2: every intent.config symbol mentioned in POLICY ---
          # Catches the converse: we pinned a symbol in intent without a
          # POLICY rationale entry. Tolerates POLICY mentioning the symbol
          # ANYWHERE (heading or prose) since we only need the rationale
          # to exist; the exact value comes from intent itself.
          intent_syms=$(sed -nE \
              -e 's/^(CONFIG_[A-Z0-9_]+)=.*/\1/p' \
              -e 's/^# (CONFIG_[A-Z0-9_]+) is not set$/\1/p' "$INTENT" | sort -u)
          policy_syms=$(grep -oE 'CONFIG_[A-Z0-9_]+' "$POLICY" | sort -u)
          # Guard against a vacuous pass: an empty intent_syms (malformed or
          # empty intent.config) would make `comm` find no orphans and this
          # direction pass silently. (The comparison itself is exact — comm
          # matches whole symbols, so CONFIG_X is never "covered" by a
          # longer CONFIG_X_Y.)
          if [[ -z $intent_syms ]]; then
              echo "  no CONFIG_ symbols parsed from $INTENT (malformed/empty?)" >&2
              fails=$((fails+1))
          fi
          orphans=$(comm -23 <(echo "$intent_syms") <(echo "$policy_syms"))
          if [[ -n $orphans ]]; then
              echo "  intent.config symbols with no POLICY mention:" >&2
              echo "$orphans" | sed 's/^/    /' >&2
              fails=$((fails+1))
          fi

          if (( fails > 0 )); then
              echo "$fails parity check(s) failed between $INTENT and $POLICY" >&2
              exit 1
          fi
          echo "intent.config and POLICY.md agree"

  no-placeholder-digests:
    # Pin placeholders must be replaced with concrete digests before a
    # Phase 1 build. This job runs on push to main only; Phase 0 PRs can
    # carry the placeholder so the scaffold builds at all.
    #
    # Scope is narrow: only Dockerfiles under containers/ (where the
    # build actually uses the digest). The shim track is intentionally
    # blocked, so shim/Dockerfile's placeholder is accepted. Docs and
    # workflow YAML are excluded so example commands and the validator's
    # own grep pattern don't trip the check.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          if grep -RnE 'sha256:REPLACE_WITH_CONCRETE_DIGEST' \
                --include='Dockerfile*' \
                containers/; then
            echo "placeholder digest(s) remain in containers/; pin before publishing" >&2
            exit 1
          fi
