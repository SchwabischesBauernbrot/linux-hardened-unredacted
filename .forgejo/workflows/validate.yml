name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      # Forgejo's act-based runner runs jobs as root inside node:22-bookworm.
      # `sudo` isn't installed; use apt-get directly.
      - run: apt-get update && apt-get install -y shellcheck
      - run: shellcheck build/*.sh tools/*.sh

  yamllint:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y yamllint
      - run: yamllint -d relaxed .forgejo/workflows/

  pycompile:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/*.py

  config-diff-sanity:
    # configs/hardened-overlay.config and configs/POLICY.md must agree
    # on which symbols exist. POLICY.md is the trust narrative; the
    # overlay is the operational truth. Drift between them is the
    # silent failure mode the audit caught.
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - name: symbol-by-symbol coverage
        run: |
          set -euo pipefail
          # Every symbol we SET — in the hardening overlay or in any
          # per-target override (configs/{distro}-{release}-{arch}.config) —
          # must be documented in POLICY.md, and POLICY.md must not document
          # symbols we don't set. Match kconfig setting lines only
          # (`CONFIG_X=...` / `# CONFIG_X is not set`) so a comment that
          # references a symbol by name isn't mistaken for setting it.
          # POLICY.md mentions symbols in `### CONFIG_X` headings and code
          # spans, so a plain token grep is the right read for it.
          set_symbols() {
            sed -nE \
                -e 's/^(CONFIG_[A-Z0-9_]+)=.*/\1/p' \
                -e 's/^# (CONFIG_[A-Z0-9_]+) is not set$/\1/p' "$@" | sort -u
          }
          configured=$(set_symbols configs/*.config)
          policy=$(grep -oE 'CONFIG_[A-Z0-9_]+' configs/POLICY.md | sort -u)
          missing_in_policy=$(comm -23 <(echo "$configured") <(echo "$policy"))
          extra_in_policy=$(comm -13 <(echo "$configured") <(echo "$policy"))
          fail=0
          if [[ -n $missing_in_policy ]]; then
            echo "symbols set in configs/*.config but not documented in POLICY.md:" >&2
            echo "$missing_in_policy" >&2
            fail=1
          fi
          if [[ -n $extra_in_policy ]]; then
            echo "symbols documented in POLICY.md but not set in any configs/*.config:" >&2
            echo "$extra_in_policy" >&2
            fail=1
          fi
          exit $fail

  no-duplicate-overlay-entries:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          # Count kconfig setting lines only; a comment that names a symbol
          # is not a duplicate setting.
          dupes=$(sed -nE \
              -e 's/^(CONFIG_[A-Z0-9_]+)=.*/\1/p' \
              -e 's/^# (CONFIG_[A-Z0-9_]+) is not set$/\1/p' \
              configs/hardened-overlay.config | sort | uniq -d)
          if [[ -n $dupes ]]; then
            echo "duplicate symbols in configs/hardened-overlay.config:" >&2
            echo "$dupes" >&2
            exit 1
          fi

  no-placeholder-digests:
    # Pin placeholders must be replaced with concrete digests before a
    # Phase 1 build. This job runs on push to main only; Phase 0 PRs can
    # carry the placeholder so the scaffold builds at all.
    #
    # Scope is narrow: only Dockerfiles under containers/ (where the
    # build actually uses the digest). The shim track is intentionally
    # blocked, so shim/Dockerfile's placeholder is accepted. Docs and
    # workflow YAML are excluded so example commands and the validator's
    # own grep pattern don't trip the check.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          if grep -RnE 'sha256:REPLACE_WITH_CONCRETE_DIGEST' \
                --include='Dockerfile*' \
                containers/; then
            echo "placeholder digest(s) remain in containers/; pin before publishing" >&2
            exit 1
          fi
