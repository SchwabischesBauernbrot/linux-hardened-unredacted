name: seed-bump
on:
  schedule:
    - cron: '0 4 * * 1'   # weekly, Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "anthraxx packaging ref to evaluate (tag/commit; default origin/HEAD = their latest)"
        required: false
        default: origin/HEAD
        type: string

# Proposes a kernel-config seed bump as a PULL REQUEST for human review,
# when anthraxx changes config.x86_64. Deliberately scoped:
#   - It opens a PR; it never auto-merges.
#   - It never cuts a kernel tag. Building+signing a kernel from a new
#     upstream stays a human-gated, signature-verified step (cve-watch.yml
#     files the issue; a human pushes the tag). This workflow only touches
#     the seed *config file*, which is exactly the kind of change a PR is
#     for.
#   - bump-seed.sh verifies the anthraxx commit's GPG signature against
#     keys/anthraxx.gpg, so an unsigned or mis-signed seed FAILS the job
#     rather than opening a PR.
#   - It proposes only when config.x86_64's sha256 actually changes — a
#     commit-only bump (same config) is not worth a PR.
#   - It bumps the stable line's seed (the only line tracked today). If more
#     lines are added later (configs/lines.toml), extend it per line.
#   - When anthraxx's packaging has moved to a NEW kernel series (his tag's
#     X.Y is newer than our stable line), a same-file bump would be a
#     cross-series pin that validate.yml's seed-pins-well-formed job rejects
#     (that is exactly what happened at 7.1 -> 7.2, PR #55). Instead it runs
#     tools/advance-line.sh, the same helper an operator uses, and the PR
#     stands the new line up: new configs/seeds/<X.Y>.toml, symlink repoint,
#     configs/lines.toml stable block. Still a PR, still human-merged.
#   - When the stable line is BRIDGED (tools/advance-line.sh <X.Y> --bridge:
#     stood up on the previous series' config before anthraxx packaged
#     <X.Y>), a newer config from that previous series is a bridge refresh,
#     proposed as an ordinary bump that keeps the marker; his first <X.Y>
#     config is a same-line bump that ends the bridge (bump-seed.sh drops the
#     marker, and the PR body says so).

jobs:
  propose:
    runs-on: linux-hardened
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out with the seed-bump token so the `git push origin`
          # below is authorized via the credential actions/checkout
          # configures — no token in a remote URL (which could leak to a
          # log). SEED_BUMP_TOKEN is a Forgejo PAT scoped write:repository
          # (push a branch + open a PR). See docs/operators/runner-setup.md.
          token: ${{ secrets.SEED_BUMP_TOKEN }}

      # node:22-bookworm (the runner default image) ships git + curl but
      # not gnupg (bump-seed.sh verifies the commit signature), jq (the
      # PR-API payload), or python3 (tools/lines.py resolves the stable
      # line's seed file). act runs as root, so no sudo.
      - name: install deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git gnupg jq curl ca-certificates python3

      - name: evaluate + bump seed (signature-verified)
        id: bump
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${REF:-origin/HEAD}"
          # Follow anthraxx's tip for the stable line (the only line tracked
          # today; see configs/lines.toml).
          stable=$(python3 tools/lines.py stable-series)
          seed_file=$(python3 tools/lines.py seed-path "$stable")
          echo "evaluating anthraxx seed for stable line $stable ($seed_file) at ref: $ref"
          sha_of() { sed -nE 's/^sha256[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$seed_file"; }
          old_sha=$(sha_of)
          # bump-seed.sh clones anthraxx, verifies the target commit's GPG
          # signature against keys/anthraxx.gpg, recomputes config.x86_64's
          # sha256, and rewrites the seed pin in place (logging a hardening-
          # relevant diff). A signature failure exits non-zero here and fails
          # the job (no PR).
          ./tools/bump-seed.sh --pin-file "$seed_file" "$ref" | tee /tmp/bump.log
          new_sha=$(sha_of)
          new_tag=$(sed -nE 's/^tag[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$seed_file")
          new_series=$(sed -nE 's/^([0-9]+\.[0-9]+)\..*/\1/p' <<<"$new_tag")
          # A BRIDGED stable line (tools/advance-line.sh <X.Y> --bridge) pins
          # the previous series' config until anthraxx packages its own. While
          # his tip is still on that previous series, a newer config there is a
          # bridge REFRESH: keep the in-place bump (the file keeps its
          # cross-series marker, which validate.yml accepts) and propose it as
          # an ordinary bump, rather than "advancing" backwards. Once his tip
          # reaches the stable series, the plain bump below ends the bridge:
          # bump-seed.sh drops the marker.
          bridged_from=$(python3 tools/lines.py bridge-from "$stable")
          if [[ -n $bridged_from && $new_series == "$bridged_from" ]]; then
            echo "stable line $stable is bridged on the $bridged_from seed; anthraxx tag $new_tag refreshes the bridge"
          elif [[ -n $new_series && $new_series != "$stable" ]]; then
            # anthraxx has moved to a new series. Undo the in-place bump (it
            # would be a cross-series pin in the OLD line's file) and stand
            # the new line up with the shared helper, which re-runs
            # bump-seed.sh against the NEW seed file (signature-verified) and
            # refuses unless $ref really is a $new_series tag.
            echo "anthraxx tag $new_tag is series $new_series; stable line is $stable -> advancing the line"
            git checkout -- "$seed_file"
            ./tools/advance-line.sh "$new_series" "$ref" | tee /tmp/bump.log
            seed_file="configs/seeds/${new_series}.toml"
            newcommit=$(sed -nE 's/^commit[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$seed_file")
            {
              echo "changed=true"
              echo "mode=advance"
              echo "newcommit=$newcommit"
              echo "new_tag=$new_tag"
              echo "old_series=$stable"
              echo "new_series=$new_series"
              echo "seed_file=$seed_file"
              # Everything the helper touched; the PR step adds exactly these.
              echo "files=configs/lines.toml configs/upstream-seed.toml $seed_file"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "seed_file=$seed_file" >> "$GITHUB_OUTPUT"
          echo "files=$seed_file" >> "$GITHUB_OUTPUT"
          echo "mode=bump" >> "$GITHUB_OUTPUT"
          if [[ $old_sha == "$new_sha" ]]; then
            echo "config.x86_64 unchanged vs $ref (sha256 $new_sha); nothing to propose"
            # bump-seed may have rewritten the commit/tag pin for a commit-
            # only move; revert so the working tree is clean and no PR opens.
            git checkout -- "$seed_file"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            newcommit=$(sed -nE 's/^commit[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$seed_file")
            echo "config.x86_64 changed: $old_sha -> $new_sha (commit $newcommit)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "newcommit=$newcommit" >> "$GITHUB_OUTPUT"
          fi

      - name: open PR
        if: steps.bump.outputs.changed == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.SEED_BUMP_TOKEN }}
          NEWCOMMIT: ${{ steps.bump.outputs.newcommit }}
          SEED_FILE: ${{ steps.bump.outputs.seed_file }}
          FILES: ${{ steps.bump.outputs.files }}
          MODE: ${{ steps.bump.outputs.mode }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          OLD_SERIES: ${{ steps.bump.outputs.old_series }}
          NEW_SERIES: ${{ steps.bump.outputs.new_series }}
        run: |
          set -euo pipefail
          if [[ -z "${FORGEJO_TOKEN:-}" ]]; then
            echo "::error::SEED_BUMP_TOKEN is not configured; cannot push a branch or open a PR."
            echo "::error::Add a Forgejo PAT scoped write:repository as SEED_BUMP_TOKEN."
            exit 1
          fi
          api="https://git.unredacted.org/api/v1/repos/${GITHUB_REPOSITORY}"
          branch="automated/seed-bump-${NEWCOMMIT:0:12}"

          # Idempotency: if an open PR from this branch already exists (a
          # prior run proposed the same bump), don't open a duplicate.
          existing=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
              "$api/pulls?state=open&limit=50" \
              | jq -r --arg h "$branch" '.[] | select(.head.ref == $h) | .number' \
              | head -n1 || true)
          if [[ -n $existing ]]; then
            echo "open PR #$existing already proposes $branch; nothing to do"
            exit 0
          fi

          if [[ $MODE == advance ]]; then
            title="lines: advance stable line ${OLD_SERIES} -> ${NEW_SERIES} (seed ${NEW_TAG})"
          else
            title="seed: bump to ${NEWCOMMIT:0:12}"
          fi

          git config user.name "forgejo-runner"
          git config user.email "noreply@unredacted.org"
          git switch -c "$branch"
          # $FILES is a space-separated list of repo-relative paths from the
          # bump step (one file for a bump; registry + symlink + new seed for
          # an advance). Word-splitting is intended.
          # shellcheck disable=SC2086
          git add $FILES
          git commit -m "$title"
          # Authorized by the checkout-configured credential (token above).
          git push origin "$branch"

          if [[ $MODE == advance ]]; then
            body=$(printf 'Automated **stable-line advance** (%s -> %s) from `tools/advance-line.sh`: anthraxx'"'"'s packaging moved to the %s series, so instead of a cross-series pin in `configs/seeds/%s.toml` this PR stands the %s line up. The anthraxx commit signature was verified against `keys/anthraxx.gpg`.\n\nWhat changes: new `%s` (header from `tools/seed-header.tmpl`), `configs/upstream-seed.toml` repointed, `configs/lines.toml` stable block -> %s (the %s block stays registered as `kind = "previous"` for retention). The %s seed file is untouched.\n\n**Review before merging:**\n- Merge this TOGETHER with pushing the first `v%s.x` tag. Once merged, a %s tag still builds but no longer emits the unversioned umbrella metas, so umbrella users would not see a %s point release until %s ships.\n- The first %s build has no same-line drift baseline in `releases/`; `build-kernel.yml` logs a *hardening-drift guard SKIPPED* warning for it (expected). Later %s builds baseline against that release.\n- Check the hardening delta below (seed %s -> %s).\n\n```\n%s\n```\n' \
              "$OLD_SERIES" "$NEW_SERIES" "$NEW_SERIES" "$OLD_SERIES" "$NEW_SERIES" \
              "$SEED_FILE" "$NEW_SERIES" "$OLD_SERIES" "$OLD_SERIES" \
              "$NEW_SERIES" "$OLD_SERIES" "$OLD_SERIES" "$NEW_SERIES" \
              "$NEW_SERIES" "$NEW_SERIES" "$OLD_SERIES" "$NEW_SERIES" "$(cat /tmp/bump.log)")
          else
            bridge_note=""
            if grep -qE '^[[:space:]]*BRIDGE ENDS' /tmp/bump.log; then
              bridge_note='**This ends a bridge:** the stable line was stood up on the previous series'"'"' config (`tools/advance-line.sh --bridge`), and this bump moves it to anthraxx'"'"'s own config for the series and drops the `# cross-series-seed:` marker. The next build of the line drift-checks against the bridged release(s), so any un-pinned default anthraxx sets differently from what `olddefconfig` chose shows up there for review.\n\n'
            elif grep -qE '^# cross-series-seed:' "$SEED_FILE"; then
              bridge_note='**Bridge refresh:** the stable line is still bridged on the previous series'"'"' config (anthraxx has not packaged the stable series yet); this moves the bridge to his newest config of that series.\n\n'
            fi
            body=$(printf 'Automated seed-bump proposal from `tools/bump-seed.sh` — the anthraxx commit signature was verified against `keys/anthraxx.gpg`.\n\n'"$bridge_note"'**Review before merging:** confirm the new seed targets the kernel version we build (the seed may legitimately lag) and that the hardening delta below is acceptable. Merging only updates the pinned config seed; the next kernel tag picks it up, and `build-kernel.yml`'"'"'s fidelity assertion + hardening-drift guard run on that build.\n\n```\n%s\n```\n' "$(cat /tmp/bump.log)")
          fi
          code=$(curl -sS -o /tmp/pr.json -w '%{http_code}' -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$title" --arg b "$body" --arg h "$branch" \
                  '{title: $t, body: $b, head: $h, base: "main"}')" \
              "$api/pulls")
          if [[ $code -ge 400 ]]; then
            echo "::error::PR create failed: HTTP $code" >&2
            cat /tmp/pr.json >&2 || true
            exit 1
          fi
          echo "opened seed-bump PR: $(jq -r '.html_url // .url // empty' /tmp/pr.json)"
