name: publish
on:
  # The human gate is workflow_dispatch. build-kernel.yml attaches the
  # signed .debs to a DRAFT release; an operator reviews it (and ideally
  # boot-tests the kernel), then runs this workflow from the Actions UI
  # with the release tag. The checkpoint matters because the kernel is a
  # boot trust root.
  #
  # NOTE on the release trigger: Forgejo's `release: published` fires
  # only when a release is *created* as published, NOT when a draft is
  # later un-drafted (verified on Forgejo v12.10.1; instance now runs
  # 15.0.2). Since we create
  # drafts for review, un-drafting emits no event — so the release
  # trigger below never fires in the normal flow. It's kept only for the
  # case of a release created already-published (or a future Forgejo that
  # fixes the draft-publish transition). workflow_dispatch is the gate
  # that actually works today.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v7.0.10-hardened1)"
        required: true
        # Forgejo requires an explicit input type; unlike GitHub it does
        # not default a typeless input to string, and renders
        # "Invalid input type" without it.
        type: string
      distribution:
        description: "Distribution / codename (trixie, bookworm, noble, jammy)"
        default: trixie
        required: true
        type: string

# Per spec §6.1: this stage holds publish credentials and does NOT have
# source-fetch credentials. The build artifacts arrive as release assets
# attached to the tag by build-kernel.yml; we fetch them via the Forgejo
# release API rather than actions/download-artifact so the pipeline works
# on every Forgejo version that supports releases.

jobs:
  publish:
    runs-on: linux-hardened
    steps:
      # Check out main, not the triggering tag. The manifest commit-back
      # at the end pushes to main; a release event would otherwise leave
      # us on a detached commit at the tag. Nothing here needs the repo
      # at the tag (assets come from the release API; tools/ is stable).
      - uses: actions/checkout@v4
        with:
          ref: main

      # The default node:22-bookworm runner image has curl and git but
      # not jq (used to parse the release API) and not necessarily a
      # python3 binary (tools/publish.py). Install both. act runs the
      # job as root, so no sudo — same pattern as cve-watch.yml /
      # validate.yml.
      - name: install jq + python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq python3

      - name: resolve target
        id: target
        # Every value here arrives via env:, NOT as a template spliced into the
        # script body. The runner substitutes an expression template into the
        # `run:` text BEFORE bash parses it, so a value containing a double
        # quote closes the assignment's quote at parse time and everything
        # after it is shell code. `inputs.version` is a free-text
        # workflow_dispatch box and `release.tag_name` is a git ref name (refs
        # permit " $ ` ; | ( ) ), and THIS job holds REGISTRY_TOKEN,
        # RELEASE_TOKEN, MANIFEST_COMMIT_TOKEN and FASTLY_PURGE_TOKEN — i.e.
        # push-to-main and upload-to-the-apt-repo. Every other step in this
        # file already uses env:; this step was the exception.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VER: ${{ inputs.version }}
          INPUT_DIST: ${{ inputs.distribution }}
        run: |
          set -euo pipefail
          # Resolve the tag + distribution from whichever trigger fired.
          if [[ "${EVENT_NAME:-}" == "release" ]]; then
            tag="${RELEASE_TAG:-}"
            # The build is single-target (trixie) today; revisit when the
            # matrix grows to multiple distributions.
            dist="trixie"
          else
            tag="${INPUT_VER:-}"
            dist="${INPUT_DIST:-}"
          fi
          [[ -n $tag ]] || { echo "could not resolve release tag" >&2; exit 1; }
          # Quoting stops command injection; it does NOT stop path traversal.
          # $tag becomes a path component (releases/<tag>/manifest.json below),
          # a `git commit -m` argument, and part of a registry URL, so a value
          # like ../../x is still harmful while being perfectly well-quoted.
          # Validate the grammar once, here, and every downstream consumer
          # (which already uses env: correctly) inherits the guarantee.
          #
          # Same grammar as build-kernel.yml's derive-version step:
          # vX.Y.Z-hardenedN[.P], N and P >= 1 with no leading zeros. Kept as a
          # deliberate duplicate rather than shared, because publish can be
          # dispatched by hand for a tag this workflow never watched get built.
          # KEEP THE TWO REGEXES IN SYNC.
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+-hardened[1-9][0-9]*(\.[1-9][0-9]*)?$ ]]; then
            echo "::error::not a release tag: $tag" >&2
            echo "::error::expected vX.Y.Z-hardenedN[.P] (N,P >=1, no leading zeros)" >&2
            exit 1
          fi
          # Allowlist, not a regex: $dist is also a path/URL component, and the
          # set of distributions we publish is small and known. Extend it in the
          # same commit that teaches the build matrix a new release.
          case $dist in
            trixie|bookworm|noble|jammy) ;;
            *) echo "::error::unknown distribution: $dist" >&2; exit 1 ;;
          esac
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          echo "publishing tag=$tag dist=$dist (event=${EVENT_NAME:-})"

      - name: download release assets
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          api="https://git.unredacted.org/api/v1/repos/${GITHUB_REPOSITORY}"
          rel=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
                   "$api/releases/tags/$TAG")
          count=$(jq '.assets | length' <<<"$rel")
          if [[ "$count" -eq 0 ]]; then
            echo "no assets attached to release $TAG" >&2
            exit 1
          fi
          # Download each asset by its browser_download_url. The
          # /releases/assets/{id} API path doesn't exist in Forgejo
          # (404), and the get-attachment API returns JSON metadata, not
          # the file. browser_download_url is the actual file link; the
          # token header authorizes it even while the release is a draft.
          jq -r '.assets[] | "\(.name)\t\(.browser_download_url)"' <<<"$rel" \
              | while IFS=$'\t' read -r name url; do
                  case "$name" in
                    *.deb|final.config|manifest.json) ;;
                    *) continue ;;
                  esac
                  echo "downloading $name from $url"
                  curl -fsSL -H "Authorization: token $FORGEJO_TOKEN" \
                       -o "artifacts/$name" \
                       "$url"
                done

      - name: split artifacts by component
        # main:  kernel image, headers, libc-dev, the two meta-packages.
        # debug: the -dbg package only.
        # Without this split, every .deb would land in whichever single
        # component was passed, so the 1 GB -dbg would pollute main (or
        # the kernel would land in debug). final.config stays in
        # artifacts/ for the commit step.
        run: |
          set -euo pipefail
          mkdir -p artifacts/main artifacts/debug
          shopt -s nullglob
          for deb in artifacts/*.deb; do
            case "$deb" in
              *-dbg_*) mv "$deb" artifacts/debug/ ;;
              *)       mv "$deb" artifacts/main/ ;;
            esac
          done
          echo "main component:";  ls -1 artifacts/main  2>/dev/null || true
          echo "debug component:"; ls -1 artifacts/debug 2>/dev/null || true

      - name: publish main + debug, purge Fastly
        env:
          FORGEJO_USER: ${{ secrets.REGISTRY_USER }}
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          FASTLY_SERVICE_ID: ${{ secrets.FASTLY_SERVICE_ID }}
          FASTLY_PURGE_TOKEN: ${{ secrets.FASTLY_PURGE_TOKEN }}
          DIST: ${{ steps.target.outputs.dist }}
          VER: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          manifest="releases/${VER}/manifest.json"
          mkdir -p "releases/${VER}"

          # Seed the per-release manifest from the build's provenance
          # manifest (attached as a release asset by build-kernel.yml).
          # publish.py appends the publishes[] records to it below. Without
          # this seed the manifest would carry only the publish log and
          # tools/repro-check.sh could not run (it needs container_image,
          # source_date_epoch, inputs, and unsigned_deb_sha256).
          if [[ -f artifacts/manifest.json ]]; then
            cp artifacts/manifest.json "$manifest"
          else
            echo "WARNING: no provenance manifest.json among release assets;" >&2
            echo "committed manifest will lack provenance and repro-check" >&2
            echo "will not be runnable for this release." >&2
          fi

          # main always has content.
          python3 tools/publish.py \
            --debs-dir artifacts/main \
            --distribution "$DIST" \
            --component main \
            --manifest "$manifest"

          # debug only if the build produced a -dbg package (depends on
          # CONFIG_DEBUG_INFO; see OPERATOR_TODO.md).
          shopt -s nullglob
          debug_debs=(artifacts/debug/*.deb)
          if (( ${#debug_debs[@]} > 0 )); then
            python3 tools/publish.py \
              --debs-dir artifacts/debug \
              --distribution "$DIST" \
              --component debug \
              --manifest "$manifest"
          else
            echo "no -dbg package; skipping debug component"
          fi

      - name: commit manifest + final.config
        # publish.py records each upload into the per-release manifest.
        # Commit it back, with the build's final.config, so the public
        # history shows what shipped and the next build's new-symbol
        # guard has something to diff against. MANIFEST_COMMIT_TOKEN is
        # scoped to push to main.
        env:
          MANIFEST_COMMIT_TOKEN: ${{ secrets.MANIFEST_COMMIT_TOKEN }}
          VER: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          release_dir="releases/${VER}"
          mkdir -p "$release_dir"

          touched=0
          if [[ -f $release_dir/manifest.json ]]; then
            git add "$release_dir/manifest.json"
            touched=1
          fi
          if [[ -f artifacts/final.config && ! -f $release_dir/final.config ]]; then
            cp artifacts/final.config "$release_dir/final.config"
            git add "$release_dir/final.config"
            touched=1
          fi
          if [[ $touched -eq 0 ]]; then
            echo "nothing to commit"
            exit 0
          fi

          git config user.name "forgejo-runner"
          git config user.email "noreply@unredacted.org"
          if git diff --cached --quiet; then
            echo "no changes; nothing to commit"
            exit 0
          fi
          git commit -m "publish: ${VER}"
          remote="https://oauth2:${MANIFEST_COMMIT_TOKEN}@git.unredacted.org/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:main"

      - name: publish the release (un-draft)
        # build-kernel.yml creates the Forgejo release as a DRAFT by design --
        # that is the human review gate before anything becomes public. This
        # workflow can read a draft's assets because it sends the token, so
        # everything above succeeds while the release is still a draft, which is
        # exactly why the un-draft step was easy to forget. Nothing in any
        # workflow did it, and it appeared in no runbook.
        #
        # Until it happens, an anonymous GET of the release assets 404s, which
        # breaks: docs/users/secure-boot.md (users wget unredacted-hardened.der
        # to enrol MOK -- without it they cannot boot the kernel they just
        # installed on a Secure Boot machine), docs/users/verifying-packages.md
        # (same download plus the fingerprint in the release notes), and
        # docs/users/cve-policy.md (the releases RSS feed is the announced
        # CVE-response channel, and drafts do not appear in it).
        #
        # LAST, after the registry publish and the manifest commit: a failure
        # earlier must leave the release a draft rather than announcing a
        # half-published release. Idempotent, so re-running publish is safe.
        #
        # This does not weaken the human gate: publish.yml is itself
        # workflow_dispatch-only. And it cannot recurse into this workflow's own
        # `release: published` trigger -- Forgejo emits no event on the
        # draft->published transition, which is verified and documented at the
        # top of this file.
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          api="https://git.unredacted.org/api/v1/repos/${GITHUB_REPOSITORY}"
          # Resolve the id from the LIST endpoint, not /releases/tags/{tag}:
          # some Forgejo versions filter drafts out of the by-tag lookup and
          # return a null id. Same reason, same pattern as build-kernel.yml's
          # release-creation step -- keep the two consistent.
          id=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
                 "$api/releases?limit=50" \
               | jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .id' \
               | head -n1)
          if [[ -z $id || $id == "null" ]]; then
            echo "::error::no release found for tag $TAG; cannot un-draft." >&2
            echo "::error::build-kernel.yml creates it, so this means the build" >&2
            echo "::error::never completed for this tag." >&2
            exit 1
          fi
          draft=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
                    "$api/releases/$id" | jq -r '.draft')
          if [[ $draft != "true" ]]; then
            echo "release $TAG (id $id) is already published; nothing to do"
            exit 0
          fi
          code=$(curl -sS -o /tmp/undraft.json -w '%{http_code}' -X PATCH \
                   -H "Authorization: token $FORGEJO_TOKEN" \
                   -H "Content-Type: application/json" \
                   -d '{"draft":false}' "$api/releases/$id")
          if [[ $code -ge 400 ]]; then
            echo "::error::un-draft failed for $TAG: HTTP $code" >&2
            cat /tmp/undraft.json >&2 || true
            exit 1
          fi
          echo "published release $TAG (id $id)"
          # Confirm the assets are reachable WITHOUT credentials before anyone
          # relies on the announcement. A 200 here is the property users
          # actually depend on; the PATCH returning 200 is not the same thing.
          asset_url="https://git.unredacted.org/${GITHUB_REPOSITORY}/releases/download/${TAG}/unredacted-hardened.der"
          anon=$(curl -sS -o /dev/null -w '%{http_code}' "$asset_url" || echo 000)
          if [[ $anon != "200" ]]; then
            echo "::warning::anonymous GET of unredacted-hardened.der returned $anon (expected 200)."
            echo "::warning::Users follow docs/users/secure-boot.md to fetch this cert; check before announcing."
          else
            echo "anonymous asset fetch OK (200): $asset_url"
          fi
